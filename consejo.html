async function gateTecla(k){
  let cur=GATE.paso==="confirma"?GATE.pin2:GATE.pin;
  if(k==="del") cur="";
  else if(k==="back"){
    if(cur.length) cur=cur.slice(0,-1);
    else if(GATE.paso==="confirma"){ GATE.paso="nuevo"; GATE.pin=""; cur=""; }
    else { GATE.paso="lista"; GATE.pin=""; GATE.pin2=""; GATE.bad=false; renderGate(); return; }
  }
  else if(cur.length<4) cur+=k;
  GATE.bad=false;
  if(GATE.paso==="confirma") GATE.pin2=cur; else GATE.pin=cur;
  renderGate();
  if(cur.length!==4) return;
  await new Promise(r=>setTimeout(r,140));

  const c=S.crew.find(x=>x.id===GATE.id);
  if(!c){ GATE.paso="lista"; renderGate(); return; }

  if(GATE.paso==="pedir"){
    const h=await hashNip(c.id,GATE.pin);
    if(c.pinh && c.pinh!==h){ GATE.bad=true; GATE.pin=""; renderGate(); toast("NIP incorrecto"); return; }
    setMe(c.id); authSet(); gateOpen=false;
    GATE.paso="lista"; GATE.pin=""; GATE.bad=false;
    render(); toast("Hola "+c.name); return;
  }
  if(GATE.paso==="nuevo"){ GATE.paso="confirma"; GATE.pin2=""; renderGate(); return; }
  /* confirma */
  if(GATE.pin2!==GATE.pin){ GATE.bad=true; GATE.pin2=""; renderGate(); toast("No coinciden"); return; }
  c.pinh=await hashNip(c.id,GATE.pin);
  setMe(c.id); authSet(); gateOpen=false;
  save("crew","registró su NIP",c.id);
  GATE.paso="lista"; GATE.pin=""; GATE.pin2=""; GATE.bad=false;
  render(); toast("NIP registrado");
}

/* ---------- borrado del NIP de otro ---------- */
function borrarNip(id){
  if(!soySuper()){ toast("Solo "+SUPER.join(", ")+" pueden hacer eso"); return; }
  const c=S.crew.find(x=>x.id===id); if(!c) return;
  if(!confirm("Borrar el NIP de "+c.name+". Va a elegir uno nuevo la próxima vez que entre.")) return;
  c.pinh="";
  save("crew","borró el NIP de "+c.name,c.id);
  if(c.id===ME){ authOut(); render(); }
  toast("NIP borrado");
}

/* ---------- la tarjeta del consejo dentro de Soporte ---------- */
function vSoporteConsejo(){
  const yo=soySuper();
  return `
  <div class="card">
    <h2>Claves del consejo</h2>
    <p class="sub">${yo?"puedes borrar el NIP de quien lo haya olvidado"
                      :"solo "+SUPER.join(", ")+" pueden borrar un NIP"}</p>
    <ul class="lst">${S.crew.map(c=>`<li>
      <div class="li-main"><div class="li-t">${esc(c.name)} ${esSuper(c)?'<span class="mk pvip">♛</span>':""}</div>
      <div class="li-s">${esc(c.code||"—")} · ${c.pinh?"con NIP registrado":"sin NIP, lo elige al entrar"}</div></div>
      ${yo&&c.pinh?`<button class="btn-gh btn-s" data-nip-del="${c.id}">Borrar NIP</button>`:""}
    </li>`).join("")}</ul>
    <p class="sub" style="margin-top:12px">clave compartida de la base: ${
      AUTHOFF?"sin activar todavía en Firebase"
      :AUTHU?"activa en este dispositivo":"falta escribirla"}</p>
    ${AUTHU?`<button class="btn-gh btn-w btn-s" id="supSalir">Olvidar la clave en este dispositivo</button>`:""}
  </div>`;
}

/* ---------- interacción ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-me],[data-gk],[data-nip-del]");
  if(!t) return;
  const me2=t.getAttribute("data-me");
  if(me2){
    e.stopPropagation(); e.preventDefault();      /* el acceso directo de antes ya no aplica */
    const c=S.crew.find(x=>x.id===me2);
    GATE.id=me2; GATE.pin=""; GATE.pin2=""; GATE.bad=false;
    GATE.paso=(c&&c.pinh)?"pedir":"nuevo";
    renderGate(); return;
  }
  const k=t.getAttribute("data-gk");
  if(k){ e.stopPropagation(); await gateTecla(k); return; }
  const d=t.getAttribute("data-nip-del");
  if(d){ e.stopPropagation(); borrarNip(d); return; }
},true);

document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="gClaveGo"){
    const v=String(($("#gClave")||{}).value||"");
    if(!v){ toast("Escribe la clave"); return; }
    await authEntrar(v); return;
  }
  if(b.id==="gOtro"){ authOut(); GATE.paso="lista"; gateOpen=true; render(); return; }
  if(b.id==="supSalir"){ authSalir(); return; }
},true);

/* ============================================================
   CLAVE DEL CONSEJO
   Una sola cuenta de Firebase para los diez. Mientras nadie entre
   con ella, la base no deja leer teléfonos, direcciones de red ni
   el tablero del consejo. La clave la escribe cada quien una vez
   por dispositivo; no viaja dentro del archivo.
   ============================================================ */
const AUTH_MAIL="consejo@antromango.mx";
const CLAVEK="mngostat.clave";
let AUTHM=null, AUTHA=null, AUTHU=null, AUTHOFF=false, AUTHLISTO=false, authMsg="";

function authFalta(){ return AUTHLISTO && !AUTHOFF && !AUTHU; }

async function authInit(app){
  try{
    let m=null;
    for(const u of ["https://cdn.jsdelivr.net/npm/firebase@10.12.0/auth/+esm",
                    "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"]){
      try{ m=await import(u); break; }catch(e){}
    }
    if(!m){ AUTHOFF=true; AUTHLISTO=true; render(); return; }
    AUTHM=m; AUTHA=m.getAuth(app);
    m.onAuthStateChanged(AUTHA,u=>{ AUTHU=u; AUTHLISTO=true; render(); });
    const cl=localStorage.getItem(CLAVEK);
    if(cl) await authEntrar(cl,true);
    else   await authProbe();
    AUTHLISTO=true; render();
  }catch(e){ AUTHOFF=true; AUTHLISTO=true; render(); }
}
/* averigua si la cuenta ya está activada sin pedirle nada a nadie */
async function authProbe(){
  try{ await AUTHM.signInWithEmailAndPassword(AUTHA,AUTH_MAIL,"probe-"+Math.random()); }
  catch(e){
    const c=String((e&&e.code)||"");
    if(/operation-not-allowed|configuration-not-found|api-key-not-valid/.test(c)) AUTHOFF=true;
  }
}
async function authEntrar(clave,callado){
  if(!AUTHM||!AUTHA) return false;
  try{
    await AUTHM.signInWithEmailAndPassword(AUTHA,AUTH_MAIL,clave);
    try{ localStorage.setItem(CLAVEK,clave); }catch(e){}
    authMsg=""; AUTHOFF=false; render();
    if(!callado) toast("Clave correcta");
    return true;
  }catch(e){
    const c=String((e&&e.code)||"");
    if(/operation-not-allowed|configuration-not-found/.test(c)){ AUTHOFF=true; render(); return true; }
    authMsg = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)
      ? "Clave del consejo incorrecta" : "No se pudo entrar ("+c.replace("auth/","")+")";
    try{ localStorage.removeItem(CLAVEK); }catch(e2){}
    if(!callado) toast(authMsg);
    render();
    return false;
  }
}
function authSalir(){
  try{ localStorage.removeItem(CLAVEK); }catch(e){}
  if(AUTHM&&AUTHA) AUTHM.signOut(AUTHA).catch(()=>{});
  AUTHU=null; authOut(); render();
}

S=load();
render();
initFB();
setInterval(()=>{ if(TAB==="home") render(); },30000);
