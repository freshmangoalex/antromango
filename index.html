<style>
:root{
  --bg:#FFFFFF; --bg2:#F4F2EE; --card:#FFFFFF; --card2:#F1EFEB;
  --line:rgba(31,23,36,.13);
  --tx:#1F1724; --tx2:#5C5169; --tx3:#8C8299;
  --sh:0 2px 12px rgba(31,23,36,.07);
  --red:#FF2D20; --org:#FF7A00; --yel:#FFC800; --lim:#A6E022; --grn:#00B050; --tea:#00C4B4; --pnk:#FF3D8F; --vio:#8B5CF6;
  --ok:#16A34A; --warn:#FFC319; --bad:#E8342B;
  --r:22px; --r2:16px; --r3:12px;
  --pad: max(14px, env(safe-area-inset-left));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-weight:600; font-size:16px; line-height:1.35;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
input,select,textarea,button{font-family:inherit;font-weight:700;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:0 var(--pad)}

/* HEADER */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#FFFFFF 72%,rgba(255,255,255,0));padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.hd img{width:40px;height:40px;border-radius:12px;flex:0 0 auto;box-shadow:0 4px 14px rgba(232,52,43,.35)}
.hd h1{font-size:19px;margin:0;letter-spacing:-.4px;font-weight:800;line-height:1}
.hd p{margin:3px 0 0;font-size:11.5px;color:var(--tx3);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.hd .who{margin-left:auto;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--tx2);max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx3);margin-right:6px;vertical-align:1px}
.syncdot.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.syncdot.local{background:var(--yel)}
.syncdot.pend{background:var(--org);box-shadow:0 0 8px var(--org)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.card .sub{margin:0 0 14px;font-size:12.5px;color:var(--tx3);font-weight:700}
.sect{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);font-weight:800;margin:22px 2px 10px}

/* COUNTDOWN */
.cd{background:linear-gradient(135deg,#E8342B,#FF7A1A 48%,#FFC319);border-radius:var(--r);padding:18px;color:#1A1014;margin-bottom:14px;position:relative;overflow:hidden}
.cd b{display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;opacity:.72;font-weight:800}
.cd .big{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.cd .wh{font-size:13.5px;font-weight:800;opacity:.78}

/* STATS */
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px;box-shadow:var(--sh)}
.stat .k{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:800;margin-bottom:5px}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat .u{font-size:11.5px;color:var(--tx3);margin-top:4px;font-weight:700}
.stat.acc{background:linear-gradient(140deg,#FFF7EF,#FFFFFF)}
.v.red{color:#F01B0E}.v.grn{color:#009A45}.v.yel{color:#C58A00}.v.tea{color:#00A99B}.v.pnk{color:#F0137A}.v.org{color:#F26B00}.v.vio{color:#7C3AED}

/* BARS */
.bar{height:11px;border-radius:999px;background:rgba(31,23,36,.085);overflow:hidden;margin:9px 0 0}
.bar i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.split{display:flex;height:34px;border-radius:999px;overflow:hidden;margin:12px 0 8px;background:rgba(31,23,36,.07)}
.split i{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#FFFFFF;transition:width .35s ease;white-space:nowrap;overflow:hidden}

/* FORMS */
.row{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.row .sm{flex:0 0 92px}
.row .xs{flex:0 0 70px}
input,select,textarea{
  width:100%;background:var(--bg2);border:1.5px solid var(--line);color:var(--tx);
  border-radius:var(--r3);padding:12px 13px;outline:none;transition:border-color .15s;
}
textarea{min-height:76px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--org)}
input::placeholder,textarea::placeholder{color:var(--tx3);font-weight:600}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
label.lb{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:800;margin:0 0 5px 3px}

/* BUTTONS */
button{border:none;border-radius:var(--r3);padding:13px 16px;background:var(--card2);color:var(--tx2);cursor:pointer;transition:transform .1s,filter .15s}
button:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,var(--red),var(--org));color:#fff;font-weight:800;box-shadow:0 5px 16px rgba(232,52,43,.3)}
.btn-g{background:linear-gradient(135deg,var(--grn),var(--tea));color:#fff;font-weight:800}
.btn-y{background:linear-gradient(135deg,var(--yel),var(--org));color:#3A2406;font-weight:800}
.btn-w{width:100%}
.btn-s{padding:9px 13px;font-size:13.5px;border-radius:11px}
.btn-gh{background:transparent;border:1.5px solid var(--line);color:var(--tx2)}
.btn-x{background:rgba(232,52,43,.10);color:#C8271E;padding:9px 11px;font-size:13px;border-radius:10px;flex:0 0 auto}

/* LISTS */
ul.lst{list-style:none;margin:12px 0 0;padding:0}
ul.lst li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid rgba(31,23,36,.07);border-radius:var(--r2);padding:11px 12px;margin-bottom:8px}
.li-main{flex:1 1 auto;min-width:0}
.li-t{font-size:15px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:12px;color:var(--tx3);font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-n{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.qin{width:72px;text-align:center;padding:6px 4px;border:1px solid rgba(128,128,128,.35);border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:17px;font-weight:800}
.qsteps{flex:1 1 100%;display:flex;gap:6px;margin-top:6px}.qsteps button{flex:1 1 0;padding:8px 0}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:22px 10px;font-weight:700}

/* PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.p-m{background:rgba(0,196,180,.18);color:#00897E}
.p-f{background:rgba(255,61,143,.16);color:#D40F67}
.p-q{background:rgba(255,195,25,.22);color:#9A6B05}
.p-ok{background:rgba(0,176,80,.16);color:#00913F}
.p-mid{background:rgba(255,195,25,.22);color:#9A6B05}
.p-bad{background:rgba(255,45,32,.14);color:#E01A0C}
.p-n{background:rgba(31,23,36,.06);color:var(--tx2)}
.p-vio{background:rgba(139,92,246,.16);color:#6D28D9}
.p-vip{background:linear-gradient(135deg,rgba(255,200,0,.3),rgba(255,122,0,.3));color:#9A5B00}
.btn-vip{background:linear-gradient(135deg,#FFC800,#FF7A00);color:#3A2406;font-weight:800}
.btn-pvip{background:linear-gradient(135deg,#8B5CF6,#FF3D8F);color:#fff;font-weight:800}
.btn-dng{background:#FF2D20;color:#fff;font-weight:800}
.btn-weed{background:linear-gradient(135deg,#00B050,#A6E022);color:#13330E;font-weight:800}
.p-weed{background:rgba(0,176,80,.16);color:#00913F}
.p-pvip{background:rgba(139,92,246,.18);color:#6D28D9}
.v.vip{color:#E08A00}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;background:var(--card);border:1.5px solid var(--line);color:var(--tx2);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--red),var(--org));color:#fff;border-color:transparent}
.tog{display:flex;gap:0;background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:3px;flex:1 1 0}
.tog button{flex:1;padding:9px 4px;font-size:13px;border-radius:999px;background:transparent;color:var(--tx3);font-weight:800}
.tog button.on{background:#FFFFFF;color:var(--tx);box-shadow:0 1px 4px rgba(31,23,36,.12)}

/* TIMELINE */
.tl{position:relative;padding-left:26px;margin-top:12px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2.5px;border-radius:2px;background:linear-gradient(180deg,var(--red),var(--org),var(--yel),var(--grn))}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--org);border:2.5px solid var(--card)}
.tl .ev.done:before{background:var(--grn)}
.tl .ev.late:before{background:var(--red);box-shadow:0 0 9px var(--red)}
.tl .d{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:800}
.tl .t{font-size:14.5px;font-weight:800;margin-top:2px}

/* NAV */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:7px 8px}
.navs::-webkit-scrollbar{display:none}
.navs button{flex:0 0 auto;background:transparent;padding:7px 11px;border-radius:14px;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px}
.navs button .ic{font-size:19px;line-height:1}
.navs button .lb2{font-size:10px;font-weight:800;letter-spacing:.2px}
.navs button.on{background:var(--card2);color:var(--tx)}
.navs button.on .lb2{color:var(--tx)}
.navs button.on .ic{filter:saturate(1.4)}
.badge{position:absolute;transform:translate(16px,-6px);background:var(--red);color:#fff;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 5px}

.hide{display:none!important}
.ring{flex:0 0 auto;display:block}
.invrow{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid rgba(31,23,36,.07);border-radius:var(--r2);padding:11px 12px;margin-bottom:8px}
.invrow .im{flex:1 1 auto;min-width:0}
.mk{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 4px;margin-left:3px;vertical-align:1px}
.mk.ok{background:rgba(0,176,80,.18);color:#00913F}
.mk.vip{background:linear-gradient(135deg,#FFC800,#FF7A00);color:#3A2406;letter-spacing:.3px}
.mk.pvip{background:linear-gradient(135deg,#8B5CF6,#FF3D8F);color:#fff}
.mk.dng{background:#FF2D20;color:#fff;letter-spacing:.5px}
.mk.noc{background:rgba(31,23,36,.1);color:var(--tx3)}
.nick{font-weight:700;color:var(--vio);font-size:13.5px}
.mk.r{background:rgba(0,176,80,.14);color:#00913F}
.mk.d{background:rgba(255,122,0,.16);color:#C55A00}
.mk.wd{background:rgba(0,176,80,.16)}
.mk.fl{background:rgba(255,195,25,.2)}
.mk.ig{background:rgba(219,39,119,.12);color:#BE185D}
.mk.wa{background:rgba(13,148,136,.13);color:#0B7268}
.mk.nm{background:rgba(124,58,237,.12);color:#6D28D9}
.donutwrap{position:relative;width:150px;margin:6px auto 2px}
.donut{width:150px;height:150px;display:block}
.dctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dctr b{font-size:21px;font-weight:800;letter-spacing:-.8px;line-height:1}
.dctr span{font-size:10.5px;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.dleg{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:12px}
.dleg span{font-size:11.5px;font-weight:800;color:var(--tx2);display:flex;align-items:center;gap:6px}
.dleg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.qq{border-radius:var(--r2);padding:11px;border:1.5px solid var(--line);background:var(--bg2);min-height:92px}
.qq h4{margin:0 0 2px;font-size:12px;font-weight:800;letter-spacing:.3px}
.qq .n{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1}
.qq .t{font-size:11px;color:var(--tx3);font-weight:700;margin-top:6px;line-height:1.4;overflow:hidden}
.q1{background:rgba(232,52,43,.07);border-color:rgba(232,52,43,.3)}
.q2{background:rgba(20,184,166,.07);border-color:rgba(20,184,166,.3)}
.q3{background:rgba(255,195,25,.1);border-color:rgba(255,195,25,.4)}
.q4{background:var(--bg2)}
.msg{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;margin-bottom:8px}
.msg .mh{font-size:11.5px;font-weight:800;color:#6D28D9;margin-bottom:4px}
.msg .mb{font-size:14px;font-weight:600;line-height:1.45;white-space:pre-wrap}
.msg.mine{background:rgba(124,58,237,.06);border-color:rgba(124,58,237,.22)}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;padding:0 var(--pad) 40px;padding-top:calc(env(safe-area-inset-top) + 26px)}
.gate .gi{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.gate .gi img{width:52px;height:52px;border-radius:16px}
.gate h2{font-size:22px;margin:0;font-weight:800;letter-spacing:-.5px}
.gate p.g2{margin:3px 0 0;font-size:13px;color:var(--tx3);font-weight:700}
.gate .u{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:9px;box-shadow:var(--sh)}
.gate .u .cd2{flex:0 0 62px;font-size:11.5px;font-weight:800;color:#6D28D9;background:rgba(124,58,237,.11);border-radius:999px;padding:5px 0;text-align:center}
.gate .u .nm{flex:1;font-size:17px;font-weight:800;color:var(--tx);letter-spacing:-.2px}
.gate .u .ad{font-size:10.5px;font-weight:800;color:#9A6B05;background:rgba(255,195,25,.22);border-radius:999px;padding:4px 9px}
.flexline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:11.5px;color:var(--tx3);font-weight:700;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#241C31;border:1px solid transparent;color:#FFF6EC;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:800;opacity:0;transition:.25s;z-index:99;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
</style>

/* agrega lista base y usuarios a un estado ya guardado, sin borrar nada */
function migrate(s){
  if(s.meta.seedv>=SEEDV) return s;
  const have=new Set(s.guests.map(g=>norm(g.name)));
  BASE_GUESTS.forEach(n=>{ if(!have.has(norm(n))) s.guests.push({id:uid(),name:n,sex:guessSex(n),conf:"si",by:"",ts:Date.now()}); });
  const hc=new Set(s.crew.map(c=>norm(c.name)));
  BASE_CREW.forEach((n,i)=>{ if(!hc.has(norm(n))) s.crew.push({id:uid(),code:"MNG-"+String(i+1).padStart(2,"0"),name:n,role:"",budget:0,admin:i===0}); });
  if(!s.crew.some(c=>c.admin)&&s.crew.length) s.crew[0].admin=true;
  numerar(s);
  s.guests=s.guests.filter(g=>!/ejemplo/i.test(g.name));
  s.crew=s.crew.filter(c=>!/ejemplo/i.test(c.name));
  s.meta.seedv=SEEDV;
  localStorage.setItem(KEY,JSON.stringify(s));
  return s;
}

function numerar(s){
  let n=+s.meta.lastNum||0;
  s.guests.forEach(g=>{ if(+g.num>n) n=+g.num; });
  const nuevos=[];
  s.guests.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"es"))
    .forEach(g=>{ if(!g.num){ g.num=++n; nuevos.push(g.id); } });
  s.meta.lastNum=n;
  return nuevos;
}

const FS=new Set(F_NAMES), MS=new Set(M_NAMES);

function guessSex(full){
  const n=norm(full); if(!n) return "?";
  const toks=n.split(/\s+/).filter(Boolean);
  if(!toks.length) return "?";
  // compuestos frecuentes: "maria jose" -> F ; "jose maria" -> M
  if(toks.length>1){
    const p=toks[0]+" "+toks[1];
    if(p==="maria jose"||p==="maria juan"||p==="maria jesus") return "F";
    if(p==="jose maria"||p==="juan maria"||p==="jose guadalupe") return "M";
  }
  for(const t of toks.slice(0,2)){
    if(FS.has(t)) return "F";
    if(MS.has(t)) return "M";
  }
  const t=toks[0];
  if(/(a|ia|ina|ela|ita|elle|lyn)$/.test(t) && !/(ia$)/.test("")) {
    if(/^(elias|tobias|matias|zacarias|isaias|jeremias|nicolas|lucas|jonas|andrea)$/.test(t)) return t==="andrea"?"F":"M";
    return "F";
  }
  if(/(o|os|el|er|an|in|on|ur|io|ck|us)$/.test(t)) return "M";
  return "?";
}

/* ---------- derivados ---------- */
function stats(){
  const g=S.guests;
  const si=g.filter(x=>x.conf==="si"), tal=g.filter(x=>x.conf==="tal");
  const base=si.length+Math.round(tal.length*0.5);
  const M=si.filter(x=>x.sex==="M").length, F=si.filter(x=>x.sex==="F").length, Q=g.filter(x=>x.sex==="?").length;
  const inn=S.money.filter(m=>m.kind==="in").reduce((a,b)=>a+(+b.amount||0),0);
  const out=S.money.filter(m=>m.kind==="out").reduce((a,b)=>a+(+b.amount||0),0);
  const goal=+S.meta.goal||0;
  const open=S.tasks.filter(t=>!t.done).length;
  const por=(S.bills||[]).filter(b=>!b.paid).reduce((a,b)=>a+(+b.amount||0),0);
  return {people:base, si:si.length, tal:tal.length, M,F,Q, inn, out, goal, bal:inn-out, falta:Math.max(0,goal-inn), open, por, libre:inn-out-por};
}
function targetOf(s){ return +s.target||0; }
/* necesidades por categoría a partir de las proporciones */
function necesidades(people){
  const r=S.ratios, shots=people*(+r.shot||0), mlAlc=shots*45;
  return {
    cerveza:{n:Math.ceil(people*(+r.beer||0)), u:"pz", k:"Cervezas"},
    vasos:{n:Math.ceil(people*(+r.cup||0)), u:"pz", k:"Vasos"},
    hielo:{n:Math.ceil(people*(+r.iceKg||0)), u:"kg", k:"Hielo"},
    alcohol:{n:Math.ceil(mlAlc/1000), u:"L", k:"Alcohol (destilados)"},
    mixer:{n:Math.ceil(mlAlc*((+r.mlNoAlc||0)/(+r.mlAlc||1))/1000), u:"L", k:"Mixers sin alcohol"},
    botana:{n:+(people*(+r.snack||0)/1000).toFixed(1), u:"kg", k:"Botana"}
  };
}
function migSup(s){
  const MAP={beer:"cerveza",cup:"vasos",iceKg:"hielo",shot:"alcohol",snack:"botana",mix:"mixer",fix:"otro"};
  const r=s.ratios||{}, p=(s.guests||[]).filter(g=>g.conf==="si").length + Math.round((s.guests||[]).filter(g=>g.conf==="tal").length*0.5);
  const tocados=[];
  (s.supplies||[]).forEach(x=>{
    if(!x.rule) return;
    const rl=x.rule;
    if(!x.target){
      let t=0;
      if(rl==="beer") t=Math.ceil(p*(+r.beer||0));
      else if(rl==="cup") t=Math.ceil(p*(+r.cup||0));
      else if(rl==="iceKg") t=Math.ceil(p*(+r.iceKg||0));
      else if(rl==="shot") t=Math.ceil(p*(+r.shot||0));
      else if(rl==="snack") t=Math.ceil(p*(+r.snack||0)/1000);
      else if(rl==="mix") t=Math.ceil(p*(+r.shot||0)*45*((+r.mlNoAlc||0)/(+r.mlAlc||1))/1000);
      x.target=t;
    }
    if(MAP[rl]) x.cat=MAP[rl];
    delete x.rule;
    tocados.push(x.id);
  });
  return tocados;
}

/* ---------- anillo de progreso ---------- */
function colorPct(p){ const x=Math.max(0,Math.min(100,p||0)); return "hsl("+Math.round(x*1.2)+" 92% 42%)"; }
function ring(p,txt,sz){
  const s=sz||64, R=26, C=2*Math.PI*R, v=Math.max(0,Math.min(100,p||0)), len=v/100*C, col=colorPct(v);
  return `<svg viewBox="0 0 64 64" class="ring" style="width:${s}px;height:${s}px">
    <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(31,23,36,.08)" stroke-width="8"></circle>
    <circle cx="32" cy="32" r="26" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" transform="rotate(-90 32 32)"></circle>
    <text x="32" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="${col}">${txt}</text></svg>`;
}
function countdown(){
  const t=new Date(S.meta.when).getTime()-Date.now();
  if(t<=0) return {txt:"EN CURSO",sub:"el evento ya empezo",ms:t};
  const d=Math.floor(t/864e5), h=Math.floor(t/36e5)%24, m=Math.floor(t/6e4)%60;
  return {txt:(d?d+"d ":"")+h+"h "+String(m).padStart(2,"0")+"m", sub:"", ms:t};
}

/* ---------- progreso real ---------- */
function progreso(){
  const st=stats();
  let sup=null;
  if(S.supplies.length){
    let acc=0;
    S.supplies.forEach(s=>{ const t=targetOf(s); acc += t>0 ? Math.min(1,(+s.qty||0)/t) : 1; });
    sup=acc/S.supplies.length*100;
  }
  const tk=S.tasks.length? S.tasks.filter(t=>t.done).length/S.tasks.length*100 : null;
  const mn=st.goal>0? Math.min(100,st.inn/st.goal*100) : null;
  const parts=[sup,tk,mn].filter(v=>v!==null);
  return {sup,tk,mn,total: parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : 0};
}
/* ---------- dona svg ---------- */
function donut(segs,centro,pie){
  const R=52, C=2*Math.PI*R;
  const tot=segs.reduce((a,s)=>a+Math.max(0,s.v),0)||1;
  let off=0;
  const arcs=segs.map(s=>{
    const len=Math.max(0,s.v)/tot*C;
    const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="17" stroke-linecap="butt"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"></circle>`;
    off+=len; return el;
  }).join("");
  return `<div class="donutwrap">
    <svg viewBox="0 0 140 140" class="donut">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(31,23,36,.07)" stroke-width="17"></circle>
      ${arcs}
    </svg>
    <div class="dctr"><b>${centro}</b><span>${pie}</span></div>
  </div>
  <div class="dleg">${segs.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.k)} ${money(s.v)}</span>`).join("")}</div>`;
}

function esUrgente(t){
  if(t.done) return false;
  if(!t.due) return t.prio>=3;
  const m=new Date(); m.setDate(m.getDate()+1);
  return t.due<=m.toISOString().slice(0,10);
}
function esImportante(t){ return (+t.prio||2)>=2; }
function misTareas(){ return S.tasks.filter(t=>!t.done && t.who===ME); }
function misBills(){ return (S.bills||[]).filter(b=>!b.paid && b.who===ME); }
function gastoDe(id){ return S.money.filter(m=>m.userId===id&&m.kind==="out").reduce((a,b)=>a+(+b.amount||0),0); }
function metioDe(id){ return S.money.filter(m=>m.userId===id&&m.kind==="in").reduce((a,b)=>a+(+b.amount||0),0); }
function deudaDe(c){ return (+c.debt||0) + Math.max(0, gastoDe(c.id)-(+c.budget||0)); }
function saldoCartera(w){
  const inn=S.money.filter(m=>m.wallet===w.id&&m.kind==="in").reduce((a,b)=>a+(+b.amount||0),0);
  const out=S.money.filter(m=>m.wallet===w.id&&m.kind==="out").reduce((a,b)=>a+(+b.amount||0),0);
  const comp=(S.bills||[]).filter(b=>!b.paid&&b.wallet===w.id).reduce((a,b)=>a+(+b.amount||0),0);
  const base=(+w.open||0)+inn-out;
  return {inn,out,comp,base,libre:base-comp};
}

function vTimeline(){
  const items=[];
  S.tasks.filter(t=>t.due).forEach(t=>items.push({d:t.due,t:t.title,done:t.done,tag:t.cat}));
  items.push({d:S.meta.when.slice(0,10),t:"🥭 "+S.meta.event,done:false,tag:"evento"});
  items.sort((a,b)=>a.d.localeCompare(b.d));
  const hoy=todayISO();
  return `<div class="card"><h2>Línea de tiempo</h2><p class="sub">fechas de entrega y de urgencia</p>
    ${items.length?`<div class="tl">${items.map(i=>`
      <div class="ev ${i.done?"done":(i.d<hoy?"late":"")}">
        <div class="d">${fmtD(i.d)}${i.d<hoy&&!i.done?" · VENCIDO":""}</div>
        <div class="t">${esc(i.t)}</div>
      </div>`).join("")}</div>`:`<div class="empty">Agrega pendientes con fecha para ver la línea</div>`}
  </div>`;
}
function fmtD(iso){
  try{const d=new Date(iso+"T12:00");return d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"}).toUpperCase();}catch(e){return iso;}
}

let GF={q:"",sex:"",conf:"",sort:"az"};
function gFiltered(){
  const q=norm(GF.q||"").trim(), so={F:0,M:1,"?":2}, co={si:0,tal:1,no:2};
  const az=(a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"});
  const cmp={az, za:(a,b)=>-az(a,b),
    sexF:(a,b)=>(so[a.sex]-so[b.sex])||az(a,b),
    sexM:(a,b)=>(((a.sex==="M"?0:a.sex==="F"?1:2))-((b.sex==="M"?0:b.sex==="F"?1:2)))||az(a,b),
    conf:(a,b)=>((co[a.conf]??3)-(co[b.conf]??3))||az(a,b),
    new:(a,b)=>(b.ts||0)-(a.ts||0)||az(a,b), old:(a,b)=>(a.ts||0)-(b.ts||0)||az(a,b),
    pts:(a,b)=>puntos(b)-puntos(a)||az(a,b),
    resp:(a,b)=>((+b.resp||0)-(+a.resp||0))||az(a,b),
    deps:(a,b)=>((+b.deps||0)-(+a.deps||0))||az(a,b)}[GF.sort]||az;
  const EX={vip:g=>!!g.vip, pvip:g=>!!g.pvip, flag:g=>!!g.flag, danger:g=>!!g.danger, smoke:g=>!!g.smoke, nocon:g=>!!g.nocon, known:g=>puntos(g)>0};
  const okSex=g=> !GF.sex ? true : (EX[GF.sex] ? EX[GF.sex](g) : g.sex===GF.sex);
  return S.guests.filter(g=>okSex(g)&&(!GF.conf||g.conf===GF.conf)&&(!q||norm(g.name).includes(q)||norm(g.nick||"").includes(q)||norm(g.full||"").includes(q))).sort(cmp);
}

  <div class="card">
    <h2>${esc(c.name)}</h2>

    <div class="grid g3">
      <div class="stat"><div class="k">Presupuesto</div><div class="v">${money(b)}</div><div class="u">${c.src==="propio"?"dinero suyo":"de la caja"}</div></div>
      <div class="stat"><div class="k">Ha gastado</div><div class="v red">${money(g)}</div><div class="u">${b?Math.round(g/b*100)+"% del tope":"sin tope"}</div></div>
      <div class="stat"><div class="k">Se le debe</div><div class="v ${deuda+exceso?"yel":"grn"}">${money(deuda+exceso)}</div><div class="u">${exceso?"excedió "+money(exceso):"sin exceso"}</div></div>

    <label class="lb">Encargo</label><div class="row"><input id="cuRole" value="${esc(c.role||"")}"></div>
    <div class="row">
      <div><label class="lb">Presupuesto $</label><input id="cuBud" type="number" inputmode="decimal" value="${b||""}"></div>
      <div><label class="lb">Origen</label><select id="cuSrc">
        <option value="caja"${c.src!=="propio"?" selected":""}>Dinero de la caja</option>
        <option value="propio"${c.src==="propio"?" selected":""}>Dinero suyo</option>
      </select></div>
    </div>
    <label class="lb">Deuda registrada a mano $</label>
    <div class="row"><input id="cuDebt" type="number" inputmode="decimal" value="${deuda||""}" placeholder="lo que puso de más"></div>

    ${S.money.filter(m=>m.userId===c.id).length?`<ul class="lst">${S.money.filter(m=>m.userId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(m=>`
      <li><span class="pill ${m.kind==="in"?"p-ok":"p-bad"}">${m.kind==="in"?"+":"−"}</span>
      <div class="li-main"><div class="li-t">${esc(m.concept||"sin concepto")}</div><div class="li-s">${fmtD(m.date||todayISO())}</div></div>
      <div class="li-n" style="color:${m.kind==="in"?"#15803D":"#C8271E"}">${money(m.amount)}</div></li>`).join("")}</ul>`:`<div class="empty">Sin movimientos</div>`}
  </div>`;
}

function vEquipo(){
  if(CU){ const c=S.crew.find(x=>x.id===CU); if(c) return vFichaCrew(c); CU=null; }
  const totalDeuda=S.crew.reduce((a,c)=>a+(+c.debt||0)+Math.max(0,gastoDe(c.id)-(+c.budget||0)),0);
  const totalPre=S.crew.reduce((a,c)=>a+(+c.budget||0),0);
  return `
  <div class="grid g3">
    <div class="stat acc"><div class="k">Consejo</div><div class="v">${S.crew.length}</div><div class="u">integrantes</div></div>
    <div class="stat"><div class="k">Presupuestos</div><div class="v">${money(totalPre)}</div><div class="u">asignados</div></div>
    <div class="stat"><div class="k">Se les debe</div><div class="v ${totalDeuda?"yel":"grn"}">${money(totalDeuda)}</div><div class="u">por reponer</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Alta en el consejo</h2>
    <p class="sub">ID sin contraseña, solo para asignar</p>
    <div class="row"><input id="cName" placeholder="Nombre"><input id="cCode" placeholder="ID" class="sm"></div>

  <div class="card">
    <h2>Integrantes</h2>
    <p class="sub">toca a alguien para editar su presupuesto y su deuda</p>
    ${S.crew.length?`<ul class="lst">${S.crew.map(c=>{
      const g=gastoDe(c.id), b=+c.budget||0, p=b?Math.min(100,g/b*100):0;
      const deuda=(+c.debt||0)+Math.max(0,g-b);

        ${b?`<div style="flex:1 1 100%"><div class="bar"><i style="width:${p}%;background:${g>b?"var(--red)":colorPct(100-p)}"></i></div>
        <div class="tiny" style="margin-top:5px">${money(g)} de ${money(b)}${g>b?" · excedió "+money(g-b):" · le quedan "+money(b-g)}</div></div>`:""}

  </div>`;

  const nec=necesidades(st.people);

  const cob=s=>{ const t=targetOf(s); return t>0? Math.min(100,(+s.qty||0)/t*100) : 100; };
  const global=inv.length? inv.reduce((a,s)=>a+cob(s),0)/inv.length : 0;

  return `

      const t=targetOf(s), q=+s.qty||0, p=cob(s);
      return `<li style="flex-wrap:wrap">
        <div class="li-main"><div class="li-t">${esc(s.name)}</div>

/* ============================================================
   RENDER + EVENTOS
   ============================================================ */
function render(){
  const V={home:vHome,feed:vFeed,foro:vForo,gente:vGente,dinero:vDinero,equipo:vEquipo,insumos:vInsumos,tareas:vTareas,musica:vMusica,deco:vDeco,bitacora:vBitacora,ajustes:vAjustes};
  $("#view").innerHTML=(V[TAB]||vHome)();
  $("#nav").innerHTML=navHTML();
  $("#whoTxt").textContent=meName()||"entrar";
  renderGate();
  const p=qCount();
  const t=$("#syncTxt");
  if(t) t.textContent = !FBon ? "Solo en este dispositivo"
    : (online ? (p? p+" cambios subiéndose" : "Todo sincronizado · sala "+ROOM)
              : (p? "Sin conexión · "+p+" cambios guardados aquí" : "Sin conexión"));
  $("#dot").className="syncdot "+(!FBon?"local":(online&&!p?"on":"pend"));
  const w=$("#whoBtn"); if(w) w.title = p? p+" cambios pendientes de subir":"";
}

document.addEventListener("click",e=>{
  const cu=e.target.closest("[data-cuopen]");
  if(cu && !e.target.closest("button")){ CU=cu.getAttribute("data-cuopen"); render(); return; }
  const gu=e.target.closest("[data-gopen]");
  if(gu && !e.target.closest("button") && !e.target.closest("a")){ GSCROLL=window.scrollY||0; GU=gu.getAttribute("data-gopen"); render(); window.scrollTo(0,0); return; }
  const th=e.target.closest("[data-thopen]");
  if(th && !e.target.closest("[data-del-th]")){ TH=th.getAttribute("data-thopen"); render(); return; }
  const gb=e.target.closest("[data-me]");
  if(gb){ setMe(gb.getAttribute("data-me")); gateOpen=false; render(); toast("Hola "+meName()); return; }
  if(e.target.closest("#whoBtn")){openGate();return;}
  const b=e.target.closest("[data-go],button"); if(!b) return;
  const g=b.getAttribute("data-go"); if(g){go(g);return;}
  const id=b.id, a=n=>b.getAttribute(n);

  /* avisos */
  if(id==="fPerm"){
    if(!window.Notification) return toast("Este navegador no soporta avisos");
    Notification.requestPermission().then(p=>{ render(); toast(p==="granted"?"Avisos activados":"Permiso no concedido"); });
    return;}

  /* entrada */
  if(id==="gNewAdd"){const n=$("#gNew").value.trim(); if(!n)return toast("Escribe tu nombre");
    const c={id:uid(),code:"MNG-"+String(S.crew.length+1).padStart(2,"0"),name:n,role:"",budget:0,admin:false};
    S.crew.push(c); setMe(c.id); gateOpen=false; save("crew","se unió "+n,c.id); toast("Hola "+n); return;}
  if(id==="gClose"){gateOpen=false; renderGate(); return;}

  /* carteras */
  if(id==="wAdd"){const wn=$("#wName").value.trim(); if(!wn) return toast("Ponle nombre");
    const nw={id:uid(),name:wn,holder:$("#wHold").value,open:+$("#wOpen").value||0,ts:Date.now()};
    S.wallets.push(nw); save("wallets","creó la cartera "+wn+" con "+money(nw.open),nw.id); toast("Cartera creada"); return;}
  if(a("data-del-w")){const wq=(S.wallets||[]).find(x=>x.id===a("data-del-w"));
    S.wallets=(S.wallets||[]).filter(x=>x.id!==a("data-del-w"));
    save("wallets","borró la cartera "+(wq?wq.name:""),a("data-del-w")); return;}

  /* gastos pendientes */
  if(id==="bAdd"){const cn=$("#bCon").value.trim(), am=+$("#bAmt").value;
    if(!cn||!am) return toast("Falta concepto o monto");
    const nb={id:uid(),concept:cn,amount:am,who:$("#bWho").value,due:$("#bDue").value,wallet:($("#bWallet")?$("#bWallet").value:""),paid:false,ts:Date.now()};
    S.bills.push(nb); save("bills","apuntó "+money(am)+" por pagar: "+cn,nb.id); toast("Apuntado"); return;}
  if(a("data-bpay")){const b2=S.bills.find(x=>x.id===a("data-bpay")); if(!b2) return;
    b2.paid=true;
    const nm2={id:uid(),kind:"out",amount:+b2.amount||0,concept:b2.concept,userId:b2.who,wallet:b2.wallet||"",date:todayISO(),by:meName()};
    S.money.push(nm2);
    save("bills","pagó "+money(b2.amount)+" de "+b2.concept,b2.id);
    save("money",undefined,nm2.id);
    toast("Registrado como gasto"); return;}
  if(a("data-del-b")){const bq=S.bills.find(x=>x.id===a("data-del-b"));S.bills=S.bills.filter(x=>x.id!==a("data-del-b"));

/* ============================================================
   SYNC FIREBASE (opcional)
   ============================================================ */
let FBon=false, db=null, ref=null, fns=null, muted=false, online=false;
const COLS=["meta","ratios","guests","money","crew","supplies","music","deco","tasks","log","feed","bills","threads","posts","wallets"];
const QKEY="mngostat.queue";

/* ---------- cola de cambios pendientes ---------- */
function qGet(){ try{ return JSON.parse(localStorage.getItem(QKEY))||[]; }catch(e){ return []; } }
function qSet(q){ try{ localStorage.setItem(QKEY,JSON.stringify(q.slice(-800))); }catch(e){} }
function qCount(){ return qGet().length; }
function enqueue(up){
  const q=qGet(), now=Date.now();
  Object.keys(up).forEach(p=>{
    for(let i=q.length-1;i>=0;i--) if(q[i].p===p) q.splice(i,1);
    q.push({p:p,v:up[p]===undefined?null:up[p],ts:now});
  });
  qSet(q); flush();
}
function flush(){
  if(!FBon||!ref||!online) return;
  const q=qGet(); if(!q.length) return;
  const up={}, stamp={};
  q.forEach(e=>{ up[e.p]=e.v; stamp[e.p]=e.ts; });
  up.fmt=2;
  fns.update(ref,up).then(()=>{
    qSet(qGet().filter(e=>!(e.p in stamp && e.ts<=stamp[e.p])));
    render();
  }).catch(err=>{ console.warn("envío pendiente",err); });
}
/* aplica una ruta pendiente sobre el estado local */
function applyPath(p,v){
  const i=p.indexOf("/");
  if(i<0){ if(p!=="fmt") S[p]=v; return; }
  const col=p.slice(0,i), id=p.slice(i+1);
  if(COLS.indexOf(col)<0) return;
  if(!Array.isArray(S[col])) S[col]=[];
  const k=S[col].findIndex(x=>x&&x.id===id);
  if(v===null||v===undefined){ if(k>=0) S[col].splice(k,1); }
  else if(k>=0) S[col][k]=v; else S[col].push(v);
}
function unpack(v,c){
  if(v===undefined||v===null) return undefined;
  if(c==="meta"||c==="ratios") return v;
  if(Array.isArray(v)) return v.filter(Boolean);
  return Object.keys(v).map(k=>v[k]).filter(Boolean);
}

               ["https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"]];
    let a,d;
    for(const [u1,u2] of SRC){ try{ a=await import(u1); d=await import(u2); break; }catch(err){ a=null; } }
    if(!a) throw new Error("no se pudo cargar firebase");
    const app=a.initializeApp(FB); db=d.getDatabase(app); fns=d;
    ref=d.ref(db,ROOM);
    FBon=true;

    /* estado real de conexión */
    d.onValue(d.ref(db,".info/connected"), s=>{
      online = s.val()===true;
      if(online) flush();
      render();
    });

    let first=true;
    d.onValue(ref,snap=>{
      const v=snap.val();
      if(!v){ enqueue(Object.assign({fmt:2}, COLS.reduce((o,c)=>(o[c]=packCol(c),o),{}))); return; }
      const antes=new Set((S.feed||[]).map(f=>f.id));
      muted=true;
      COLS.forEach(c=>{ const u=unpack(v[c],c); if(u!==undefined) S[c]= (c==="meta"||c==="ratios") ? Object.assign(S[c],u) : u; });
      /* lo que aún no se ha enviado vuelve a montarse encima */
      qGet().forEach(e=>applyPath(e.p,e.v));
      const sinFolio=numerar(S).concat([]);
      const supMig=migSup(S);
      localStorage.setItem(KEY,JSON.stringify(S));
      muted=false;
      if(v.fmt!==2) enqueue(Object.assign({fmt:2}, COLS.reduce((o,c)=>(o[c]=packCol(c),o),{})));
      else if((sinFolio.length||supMig.length) && isAdmin()){
        const up={};
        sinFolio.forEach(i=>{ const g=S.guests.find(x=>x.id===i); if(g) up["guests/"+i]=g; });
        supMig.forEach(i=>{ const x=S.supplies.find(y=>y.id===i); if(x) up["supplies/"+i]=x; });
        up.meta=S.meta; enqueue(up);
      }
      render();
      if(!first){
        const nuevos=(S.feed||[]).filter(f=>!antes.has(f.id)&&f.who!==meName());
        if(nuevos.length){
          const u=nuevos[nuevos.length-1];
          const yo=meName();
          const mio = yo && nuevos.some(f=>f.text.indexOf(yo)>=0);
          const txt=(mio?"Para ti · ":"")+u.who+" "+u.text+(nuevos.length>1?" (+"+(nuevos.length-1)+" más)":"");
          toast(txt); notify(txt);
        }
      }
      first=false;
    });
    render();
  }catch(e){ FBon=false; console.warn("sync off",e); }
}
window.addEventListener("online",()=>{ flush(); render(); });
window.addEventListener("offline",()=>{ online=false; render(); });
setInterval(flush,15000);

/* ---------- arranque ---------- */
S=load();
render();
initFB();
setInterval(()=>{ if(TAB==="home") render(); },30000);
</script>
