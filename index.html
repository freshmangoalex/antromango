<style>
:root{
  --bg:#FFFFFF; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F4F2EE;
  --line:rgba(31,23,36,.13);
  --tx:#1F1724; --tx2:#5C5169; --tx3:#8C8299;
  --sh:0 2px 12px rgba(31,23,36,.07);
  --sh2:0 10px 34px rgba(31,23,36,.13);
  --red:#FF2D20; --org:#FF7A00; --yel:#FFC800; --grn:#00B050;
  --r:22px;
  --pad: max(16px, env(safe-area-inset-left));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg2);color:var(--tx)}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%; min-height:100dvh;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:0 var(--pad);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.pane{padding-top:calc(10px + env(safe-area-inset-top))}

.top{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 0 6px;
  font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.01em}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--yel)}
.dot.on{background:var(--grn)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card.flat{background:var(--card2);box-shadow:none}
h1{margin:0}
h2{font-size:21px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px}
h3{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:0 0 10px}
p{margin:0 0 10px;color:var(--tx2);font-size:14.5px}
p.lead{color:var(--tx);font-size:15.5px}
p:last-child{margin-bottom:0}
.mut{color:var(--tx3);font-size:12.5px}
a{color:var(--org);font-weight:800;text-decoration:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:16px;background:var(--tx);color:#fff;font-weight:800;font-size:16px;
  letter-spacing:-.01em;transition:transform .12s ease}
.btn:active{transform:scale(.978)}
.btn.mango{background:linear-gradient(135deg,var(--org),var(--red) 95%)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.wa{background:#25D366;color:#06351A;margin-bottom:12px}
.btn.sm{padding:12px 14px;font-size:14px;border-radius:13px}

.fld{display:block;margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.fld input{width:100%;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
  font-size:16.5px;font-weight:600;outline:none}
.fld input:focus{border-color:var(--org)}

/* portada: sin recuadros, todo suelto sobre el blanco */
.hero{text-align:center;padding:6px 4px 2px}
.hero img{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 10px}
.hero .ttl{font-size:clamp(19px,6vw,24px);font-weight:900;letter-spacing:.01em;line-height:1.05;
  text-transform:uppercase;color:var(--tx2)}
.hero .when{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--tx3)}
.cd{display:flex;gap:0;justify-content:center;align-items:flex-start;margin:22px 0 6px;text-align:center}
.cd div{flex:1 1 0;min-width:0;text-align:center}
.cd b{display:block;font-size:clamp(34px,12.5vw,52px);font-weight:900;letter-spacing:-.055em;line-height:.95;
  background:linear-gradient(160deg,#FF9500,#FF2D20 78%);-webkit-background-clip:text;background-clip:text;
  color:transparent;font-variant-numeric:tabular-nums}
.cd span{display:block;margin-top:5px;font-size:9.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx3)}
.cd .sep{flex:0 0 6px;font-size:clamp(26px,9vw,38px);font-weight:800;color:#FFD0B8;line-height:1}
.libre{text-align:center;padding:4px 2px 0}
.libre h2{font-size:23px;margin-bottom:6px}
.libre p{font-size:15px}

.hit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--card);
  border-radius:15px;box-shadow:var(--sh);margin-bottom:8px}
.hit .av{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;
  font-weight:900;font-size:14px;color:var(--tx2);flex:none}
.hit.done .av{background:#E8F7EE;color:#0B6B35}
.hit .nm{font-weight:800;letter-spacing:-.015em;font-size:15.5px}
.hit .sb{font-size:12px;color:var(--tx3);font-weight:600}
.hit .ar{margin-left:auto;color:var(--tx3);font-weight:900}

.pins{display:flex;gap:12px;justify-content:center;margin:18px 0 22px}
.pins i{width:15px;height:15px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);
  transition:transform .14s ease,background .14s}
.pins i.f{background:var(--tx);box-shadow:none;transform:scale(1.12)}
.pins.bad i{background:#FDE2E0;box-shadow:inset 0 0 0 1.5px rgba(232,52,43,.45)}
@keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.pins.bad{animation:shk .4s}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kp button{padding:16px 0;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:23px;font-weight:800}
.kp button:active{background:var(--card2)}
.kp button.z{background:transparent;box-shadow:none;font-size:14.5px;font-weight:800;color:var(--tx2)}

.tk{background:var(--card);border-radius:24px;box-shadow:var(--sh2);overflow:hidden;margin-bottom:12px}
.tk .hd{background:linear-gradient(135deg,var(--org),var(--red) 92%);color:#fff;padding:16px 18px}
.tk .hd .e1{font-weight:900;font-size:19px;letter-spacing:-.03em}
.tk .hd .e2{font-size:12.5px;font-weight:700;opacity:.92}
.perf{position:relative;height:22px;background:var(--card)}
.perf:before,.perf:after{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%;
  background:var(--bg2);transform:translateY(-50%)}
.perf:before{left:-11px} .perf:after{right:-11px}
.perf hr{position:absolute;top:50%;left:14px;right:14px;border:0;border-top:2px dashed var(--line);margin:0}
.qrw{padding:4px 18px 16px;text-align:center}
.qrw .qr{display:inline-block;background:#fff;padding:10px;border-radius:14px}
.qrw .qr table{border-collapse:collapse;border-spacing:0;margin:0 auto}
.qrw .qr td{width:var(--c,5px);height:var(--c,5px);padding:0;line-height:0}
.qrw .qr td.d{background:var(--qc,#1F1724)}
.tk .hd{position:relative;overflow:hidden}
.vipb{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:999px;font-size:10.5px;
  font-weight:900;letter-spacing:.16em;background:rgba(255,255,255,.22);color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.tk .hd .e1,.tk .hd .e2,.tk .hd .vipb{position:relative;z-index:1}
.stars i{position:absolute;width:7px;height:7px;background:#fff;opacity:.9;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:tw 2.6s ease-in-out infinite}
.stars i:nth-child(2n){width:5px;height:5px}
.stars i:nth-child(3n){width:9px;height:9px}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.tk-vip .qrw .qr{box-shadow:0 0 0 2px rgba(201,150,27,.5), 0 0 22px rgba(201,150,27,.35)}
.tk-pvip .qrw .qr{box-shadow:0 0 0 2px rgba(124,58,237,.5), 0 0 22px rgba(124,58,237,.35)}
.tk-vip .folio{color:#8A6200} .tk-pvip .folio{color:#5B21B6}
@media (prefers-reduced-motion:reduce){.stars i{animation:none;opacity:.8}}
.folio{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.14em;margin-top:12px}
.tkname{font-size:19px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.rows{padding:0 18px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.row b{font-weight:800;text-align:right}
.row span{color:var(--tx3);font-weight:700}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800}
.chip.ok{background:#E8F7EE;color:#0B6B35} .chip.wait{background:#FFF6DC;color:#7A5B00}

.itm{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.itm .hh{display:flex;align-items:center;gap:12px}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900}
.itm .nm{font-weight:800;letter-spacing:-.015em;font-size:15.5px}
.itm .sb{font-size:12.5px;color:var(--tx3);font-weight:700}
.stp{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stp .lb{font-size:12.5px;font-weight:800;color:var(--tx2);margin-right:auto}
.stp button{width:38px;height:38px;border-radius:12px;background:var(--card2);font-size:19px;font-weight:800;flex:none}
.stp input{width:64px;text-align:center;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);
  font-size:16px;font-weight:800;background:var(--card)}
.mine{background:#FFF6DC;border-radius:12px;padding:8px 11px;margin-top:10px;font-size:12.5px;font-weight:700;color:#7A5B00}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:800;color:var(--tx3)}
nav button i{font-size:19px;font-style:normal;line-height:1}
nav button.on{color:var(--tx)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:var(--tx);color:#fff;padding:11px 17px;border-radius:14px;font-size:13.5px;font-weight:700;
  opacity:0;transition:.22s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
#toast.s{opacity:1;transform:translateX(-50%) translateY(0)}

var qrcode = function() {

   * @param typeNumber 1 to 40

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _modules = null;
    var _moduleCount = 0;

    var _dataList = [];

    var _this = {};

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);

          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {

          }
        }

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }

    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {

          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {

            index += 1;
          }

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

    _this.addData = function(data, mode) {

        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;

            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {

            break;
          }

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +

      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {

            qrSvg += 'M' + mc + ',' + mr + rect;
          }

      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")

const folio=n=>"A"+String(n||0).padStart(5,"0");
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

function hora(ts){ if(!ts) return "—"; const d=new Date(+ts);
  return d.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" · "+
         d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}); }
function fechaLarga(){
  const d=new Date(EV.iso);

         d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false})+" h";
}

/* huella del navegador, propia de este teléfono */
function devInfo(){
  let id=ls.g(LK.dev,null);
  if(!id){ id=uid()+uid(); ls.s(LK.dev,id); }
  const ua=navigator.userAgent||"";
  let mod="Dispositivo";
  if(/iPhone/i.test(ua)) mod="iPhone";
  else if(/iPad/i.test(ua)) mod="iPad";
  else if(/Android/i.test(ua)) mod=((ua.match(/Android[^;)]*;\s*([^;)]+)/)||[])[1]||"Android").trim();
  else if(/Macintosh/i.test(ua)) mod="Mac";
  else if(/Windows/i.test(ua)) mod="Windows";
  let nav="Navegador";
  if(/Instagram/i.test(ua)) nav="Instagram";
  else if(/FBAN|FBAV/i.test(ua)) nav="Facebook";
  else if(/CriOS|Chrome/i.test(ua)) nav="Chrome";
  else if(/FxiOS|Firefox/i.test(ua)) nav="Firefox";
  else if(/Safari/i.test(ua)) nav="Safari";
  return { id, mod, nav, scr:screen.width+"x"+screen.height,
           lang:navigator.language||"", tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||"") };
}
const DEV=devInfo();

/* La dirección de red la devuelve un servicio externo porque el navegador
   no la conoce. ipapi agrega ciudad aproximada; ipify solo la dirección. */
async function net(){
  if(NET) return NET;
  const fuentes=[
    ["https://ipapi.co/json/", j=>({ip:j.ip,ciudad:[j.city,j.region,j.country_name].filter(Boolean).join(", ")})],
    ["https://api.ipify.org?format=json", j=>({ip:j.ip,ciudad:""})]
  ];
  for(const [u,map] of fuentes){ try{
    const c=new AbortController(), t=setTimeout(()=>c.abort(),4500);
    const r=await fetch(u,{signal:c.signal}); clearTimeout(t);
    const j=await r.json(); const v=map(j);
    if(v&&v.ip){ NET=v; return NET; }
  }catch(e){} }
  return {ip:"",ciudad:""};
}

/* El NIP se guarda derivado con SHA-256 sobre el identificador del pase.
   Cuatro dígitos no constituyen un secreto fuerte; esto solo evita
   guardarlos en claro y hace que nadie los pueda cambiar después. */
async function hashPin(gid,p){
  const txt="am4:"+gid+":"+p;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=0x811c9dc5;
  for(let i=0;i<txt.length;i++){ h^=txt.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return "fnv"+h.toString(16);
}

/* ---------- escritura con cola, sobrevive a la falta de señal ---------- */
function qGet(){ return ls.g(LK.q,[]); }
function put(up){
  const c=qGet(); Object.keys(up).forEach(p=>c.push({p,v:up[p]})); ls.s(LK.q,c); flush();
}
async function flush(){
  if(!FBon||!db) return;
  const c=qGet(); if(!c.length) return;
  const up={}; c.forEach(e=>up[e.p]= e.v===null?null:e.v);
  try{ await fns.update(fns.ref(db,ROOM),up); ls.s(LK.q,[]); }catch(e){}
}

}
const vBoot=()=>'<div class="ld"><div class="spin"></div>Abriendo…</div>';

function head(sub){
  return '<div class="top"><span class="dot '+(online?"on":"")+'"></span>'+esc(sub||"")+'</div>';
}
function cuenta(){
  const t=new Date(EV.iso).getTime()-Date.now();
  if(t<=0) return '<div class="cd"><div style="flex:1 1 100%"><b style="font-size:30px">Está pasando</b></div></div>';
  const d=Math.floor(t/864e5), hh=Math.floor(t/36e5)%24,
        mm=Math.floor(t/6e4)%60, ss=Math.floor(t/1e3)%60;
  const z=n=>String(n).padStart(2,"0");
  const c=(v,l)=>'<div><b>'+v+'</b><span>'+l+'</span></div>';
  return '<div class="cd" id="cd">'+c(d,"días")+c(z(hh),"horas")+c(z(mm),"min")+c(z(ss),"seg")+'</div>';
}

/* ---------- buscar el nombre en la lista ---------- */
function buscar(txt){
  const n=norm(txt);
  if(n.length<2) return [];
  const pal=n.split(" ");
  return Object.keys(roster).map(g=>Object.assign({gid:g},roster[g]))
    .filter(x=>{ const k=norm(x.name)+" "+norm(x.nick)+" "+norm(x.full);
                 return pal.every(w=>k.indexOf(w)>=0); })
    .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")))
    .slice(0,8);
}
function hitsHTML(){
  const n=norm(q), hits=buscar(q);
  if(!Object.keys(roster).length)
    return '<p class="mut">La lista todavía no se ha publicado. Vuelve a abrir esta página en un rato.</p>';
  if(n.length<2) return '<p class="mut">Escribe al menos dos letras de tu nombre.</p>';
  if(!hits.length)
    return '<p class="mut">Ese nombre no está en la lista.</p>'+
           '<a class="btn wa" href="'+waLink(q)+'" target="_blank" rel="noopener">Avisar que no aparezco</a>';
  return hits.map(x=>{
    const ya=!!live[x.gid];
    return '<button class="hit '+(ya?"done":"")+'" data-pick="'+esc(x.gid)+'">'+
     '<div class="av">'+(ya?"✓":esc(String(x.name||"?").trim().charAt(0).toUpperCase()))+'</div>'+
     '<div><div class="nm">'+esc(x.name)+'</div><div class="sb">'+
     (x.nick?esc(x.nick)+" · ":"")+folio(x.num)+(ya?" · ya tiene pase":"")+'</div></div>'+
     '<div class="ar">›</div></button>';
  }).join("")+
  '<p class="mut" style="text-align:center">¿No eres ninguno? <a href="'+waLink(q)+'" target="_blank" rel="noopener">Avísanos</a></p>';
}

function drawQR(){
  const box=$("#qr"); if(!box||!me) return;
  const txt="AM4|"+me.gid+"|"+me.num;
  try{
    const g=qrcode(0,"M"); g.addData(txt); g.make();
    const n=g.getModuleCount();
    /* el código se dibuja lo más grande que quepa: se lee mejor en la puerta */
    const disp=Math.min(300,Math.max(200,(window.innerWidth||390)-96));
    const px=Math.max(4,Math.min(9,Math.floor(disp/n)));
    let t='<table style="--c:'+px+'px;--qc:'+tema().qr+'">';
    for(let r=0;r<n;r++){ t+='<tr>';
      for(let c=0;c<n;c++) t+='<td class="'+(g.isDark(r,c)?"d":"")+'"></td>';
      t+='</tr>'; }
    box.innerHTML=t+'</table>';
  }catch(e){ box.innerHTML='<div class="mut">'+esc(txt)+'</div>'; }
}

/* ---------- qué falta y qué lleva cada quien ---------- */
function prometido(){
  const p={};
  Object.keys(live).forEach(g=>{ const b=live[g].bring||{};
    Object.keys(b).forEach(s=>{ p[s]=(p[s]||0)+(+b[s].qty||0); }); });
  if(me&&mine&&mine.bring&&!live[me.gid]){
    Object.keys(mine.bring).forEach(s=>{ p[s]=(p[s]||0)+(+mine.bring[s].qty||0); });
  }
  return p;
}
function vFalta(){
  const ids=Object.keys(needs), mio=(mine&&mine.bring)||{}, prom=prometido();
  let h='<div class="pane">'+head("Qué falta para la fiesta")+
   '<div class="card"><h2>Qué falta</h2><p class="lead">Lo que ya hay contra lo que hace falta. '+
   'Apunta lo que tú vas a llevar y el consejo lo descuenta de la cuenta.</p>'+
   '<div style="display:flex;gap:14px;margin-top:10px;font-size:12px;font-weight:800;color:var(--tx2)">'+
   '<span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+COL_CONS+';margin-right:5px"></i>ya comprado</span>'+
   '<span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+COL_INV+';margin-right:5px"></i>lo que llevan los invitados</span>'+
   '</div></div>';
  if(!ids.length) return h+'<p class="mut">Todavía no se ha publicado el inventario.</p></div>';
  ids.sort((a,b)=>String(needs[a].name||"").localeCompare(String(needs[b].name||""))).forEach(s=>{
    const it=needs[s], t=+it.target||0, hay=+it.qty||0, pr=+prom[s]||0;
    const falta=Math.max(0,t-hay-pr);
    const yo=mio[s]?(+mio[s].qty||0):0;
    h+='<div class="itm"><div class="hh">'+ring(t>0?hay/t:0,t>0?pr/t:0,t>0)+'<div><div class="nm">'+esc(it.name)+'</div>'+
      '<div class="sb">'+(t>0
        ?'hay '+hay+' de '+t+' '+esc(it.unit||"")+(falta?' · faltan '+falta:' · completo')
        :'hay '+hay+' '+esc(it.unit||"")+' · sin meta')+
      (pr?' · prometido '+pr:"")+'</div></div></div>'+
      '<div class="stp"><div class="lb">Yo llevo</div>'+
      '<button data-b="'+esc(s)+'|-1">−</button>'+
      '<input data-bv="'+esc(s)+'" type="number" inputmode="numeric" min="0" value="'+yo+'">'+
      '<button data-b="'+esc(s)+'|1">+</button></div>'+
      (yo?'<div class="mine">Apuntado: '+yo+' '+esc(it.unit||"")+' de '+esc(it.name)+'</div>':"")+'</div>';
  });
  return h+'<p class="mut">Lo que apuntas aquí lo ve el consejo al instante. Si cambias de opinión, bájalo a cero.</p></div>';
}
/* dos arcos: lo que el consejo ya tiene y lo que los invitados prometieron */
const COL_CONS="#2563EB", COL_INV="#00B050";
function ring(a,b,real){
  const R=20,C=2*Math.PI*R;
  a=Math.max(0,Math.min(1,a||0));
  b=Math.max(0,Math.min(1-a,b||0));
  const arc=(col,ini,len)=> len<=0?"":
    '<circle cx="23" cy="23" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="5" '+
    'stroke-dasharray="'+(len*C).toFixed(2)+' '+((1-len)*C).toFixed(2)+'" '+
    'stroke-dashoffset="'+(-ini*C).toFixed(2)+'"></circle>';
  return '<div class="ring"><svg width="46" height="46" viewBox="0 0 46 46">'+
   '<circle cx="23" cy="23" r="'+R+'" fill="none" stroke="var(--card2)" stroke-width="5"></circle>'+
   (real?arc(COL_CONS,0,a)+arc(COL_INV,a,b):"")+'</svg>'+
   '<b>'+(real?Math.round((a+b)*100)+"%":"—")+'</b></div>';
}

/* =====================================================================
   interacción
   ===================================================================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-pick],[data-k],[data-go],[data-tab],[data-b],[data-inv]"); if(!t) return;
  const d=t.dataset;
  if(d.tab){ TAB=d.tab; render(); return; }
  if(d.pick){
    pick=Object.assign({gid:d.pick},roster[d.pick]||{});
    pin=""; pin2=""; pinBad=false;
    if(live[pick.gid]){ PINMODE="open"; SCR="pin"; } else SCR="alta";
    render(); return;
  }
  if(d.go==="quien"){
    const tel=String(($("#tel")||{}).value||"").replace(/\D/g,"");
    if(tel.length<10){ toast("Pon un teléfono de 10 dígitos"); return; }
    pick.tel=tel; qi=""; invPick=null; SCR="quien"; render(); return;
  }
  if(d.inv){
    const x=roster[d.inv]||{};
    invPick={gid:d.inv,name:x.name||"",num:+x.num||0};
    render(); return;
  }
  if(d.go==="pinnew"){
    if(!invPick){ toast("Elige quién te invitó"); return; }
    pin=""; pin2=""; PINMODE="nuevo"; SCR="pin"; render(); return;
  }
  if(d.go==="salir"){
    ls.d(LK.me); ls.d(LK.mine);
    me=null; mine=null; pick=null; q=""; SCR="find"; render(); return;
  }
  if(d.k){ await keypad(d.k); return; }
  if(d.b){
    const p=d.b.split("|"), sid=p[0], dl=+p[1];
    const cur=(mine&&mine.bring&&mine.bring[sid])?(+mine.bring[sid].qty||0):0;
    setBring(sid,Math.max(0,cur+dl)); return;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ q=e.target.value; const c=$("#hits"); if(c) c.innerHTML=hitsHTML(); }
  if(e.target.id==="qi"){ qi=e.target.value; const c=$("#invh"); if(c) c.innerHTML=invHTML(); }
});
document.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d&&d.bv) setBring(d.bv,Math.max(0,Math.round(+e.target.value||0)));
});

async function keypad(k){
  let cur=PINMODE==="confirma"?pin2:pin;
  if(k==="del") cur="";
  else if(k==="back"){
    if(cur.length) cur=cur.slice(0,-1);
    else if(PINMODE==="confirma"){ PINMODE="nuevo"; pin=""; cur=""; }
    else if(PINMODE==="nuevo"){ SCR="quien"; pin=""; render(); return; }
    else { SCR=me?"pass":"find"; pick=null; pin=""; render(); return; }
  }
  else if(cur.length<4) cur+=k;
  pinBad=false;
  if(PINMODE==="confirma") pin2=cur; else pin=cur;
  render();
  if(cur.length!==4) return;
  await new Promise(r=>setTimeout(r,150));
  if(PINMODE==="open") return abrirConNip();
  if(PINMODE==="nuevo"){ PINMODE="confirma"; pin2=""; render(); return; }
  if(pin2!==pin){ pinBad=true; pin2=""; render(); toast("No coinciden"); return; }
  return altaFinal();
}

/* ---------- abrir un pase que ya existe ---------- */
async function abrirConNip(){
  const g=(pick||me).gid;
  const h=await hashPin(g,pin);
  let real=null;
  if(FBon&&db){ try{ const s=await fns.get(fns.ref(db,ROOM+"/reg/"+g)); if(s.exists()) real=s.val(); }catch(e){} }
  if(!real&&mine&&mine.gid===g&&mine.pinh) real={pinh:mine.pinh,tel:mine.tel,ts:mine.ts};
  if(!real){ pin=""; render(); toast("No pudimos verificar. Revisa tu conexión."); return; }
  if(real.pinh&&real.pinh!==h){ pinBad=true; pin=""; render(); toast("NIP incorrecto"); return; }
  const base=roster[g]||live[g]||{};
  me={gid:g,num:base.num,name:base.name};
  ls.s(LK.me,me);
  /* lo guardado en el teléfono es la base; la rama pública manda cuando existe */
  const antes=(mine&&mine.gid===g)?mine:{};
  mine=Object.assign({},antes,live[g]||{},
        {gid:g,tel:real.tel||antes.tel,pinh:real.pinh||antes.pinh,
         ts:real.ts||(live[g]||{}).ts||antes.ts});
  ls.s(LK.mine,mine);
  pin=""; pick=null; SCR="pass"; TAB="pass"; render();
  logOpen();
}

/* ---------- alta de un pase nuevo ---------- */
async function altaFinal(){
  const g=pick.gid, ts=Date.now();
  const h=await hashPin(g,pin);
  const n=await net();
  const k=uid();
  const inv=invPick?{gid:invPick.gid,name:invPick.name,num:invPick.num}:null;
  const pub={ gid:g, num:pick.num, name:pick.name, ts, opens_n:1, last:ts, bring:{} };
  if(inv) pub.inv=inv;
  const prv={ gid:g, num:pick.num, name:pick.name, tel:pick.tel, pinh:h, ts, inv:inv||null,
              ip:n.ip||"", ciudad:n.ciudad||"",
              dev:{id:DEV.id,mod:DEV.mod,nav:DEV.nav,scr:DEV.scr,lang:DEV.lang,tz:DEV.tz},
              opens:{} };
  prv.opens[k]={ts,ip:n.ip||"",ciudad:n.ciudad||"",dev:DEV.id,mod:DEV.mod,nav:DEV.nav};
  put({ ["live/"+g]:pub, ["reg/"+g]:prv });
  live[g]=pub;
  me={gid:g,num:pick.num,name:pick.name}; ls.s(LK.me,me);
  mine=Object.assign({},pub,{tel:pick.tel,pinh:h}); ls.s(LK.mine,mine);
  pin=""; pin2=""; PINMODE="open"; pick=null; invPick=null; qi=""; SCR="pass"; TAB="pass"; render();
  toast("Tu pase está listo");
}

/* ---------- cada apertura del código queda con su hora ---------- */
async function logOpen(){
  if(!me) return;
  const ts=Date.now(), k=uid(), n=await net();
  const nn=(+((mine||{}).opens_n)||0)+1;
  put({ ["reg/"+me.gid+"/opens/"+k]:{ts,ip:n.ip||"",ciudad:n.ciudad||"",dev:DEV.id,mod:DEV.mod,nav:DEV.nav},
        ["live/"+me.gid+"/opens_n"]:nn,
        ["live/"+me.gid+"/last"]:ts });
  mine=Object.assign({},mine||{},{opens_n:nn,last:ts}); ls.s(LK.mine,mine);
  if(live[me.gid]){ live[me.gid].opens_n=nn; live[me.gid].last=ts; }
  if(SCR==="pass"&&TAB==="pass") render();
}

/* ---------- lo que el asistente se compromete a llevar ---------- */
function setBring(sid,n){
  if(!me) return;
  const it=needs[sid]||{};
  mine=mine||{}; mine.bring=Object.assign({},mine.bring||{});
  if(n<=0){ delete mine.bring[sid]; put({["live/"+me.gid+"/bring/"+sid]:null}); }
  else{
    const v={qty:n,unit:it.unit||"",name:it.name||"",ts:Date.now()};
    mine.bring[sid]=v; put({["live/"+me.gid+"/bring/"+sid]:v});
  }
  ls.s(LK.mine,mine);
  if(live[me.gid]) live[me.gid].bring=Object.assign({},mine.bring);
  render();
}

/* =====================================================================
   sincronización
   ===================================================================== */
async function initFB(){
  try{
    const SRC=[["https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm",
                "https://cdn.jsdelivr.net/npm/firebase@10.12.0/database/+esm"],
               ["https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"]];
    let a,d;
    for(const s of SRC){ try{ a=await import(s[0]); d=await import(s[1]); break; }catch(err){ a=null; } }
    if(!a) throw new Error("firebase no cargó");
    const app=a.initializeApp(FB); db=d.getDatabase(app); fns=d; FBon=true;
    d.onValue(d.ref(db,".info/connected"),s=>{ online=s.val()===true; if(online) flush(); render(); });
    d.onValue(d.ref(db,ROOM+"/roster"),s=>{ roster=s.val()||{}; ls.s(LK.ros,roster);
      if(SCR==="find"){ const c=$("#hits"); if(c) c.innerHTML=hitsHTML(); else render(); } });
    d.onValue(d.ref(db,ROOM+"/needs"),s=>{ needs=s.val()||{}; ls.s(LK.nee,needs);
      if(SCR==="pass"&&TAB==="falta") render(); });
    d.onValue(d.ref(db,ROOM+"/rules"),s=>{ rules=s.val()||""; ls.s(LK.rul,rules);
      if(SCR==="pass"&&TAB==="reglas") render(); });
    d.onValue(d.ref(db,ROOM+"/live"),s=>{
      live=s.val()||{};
      if(me&&live[me.gid]) { mine=Object.assign({},mine||{},live[me.gid],
        {tel:(mine||{}).tel,pinh:(mine||{}).pinh}); ls.s(LK.mine,mine); }
      render();
    });
  }catch(e){ FBon=false; render(); }
}

/* =====================================================================
   arranque
   ===================================================================== */
(function boot(){
  if(me&&me.gid){ PINMODE="open"; pick=null; SCR="pin"; }   /* teléfono conocido: pide el NIP */
  else SCR="find";
  render();
  net();
  initFB();
  /* el segundero se repinta solo, sin volver a dibujar la pantalla */
  setInterval(()=>{ if(SCR!=="find") return; const c=$("#cd"); if(c) c.outerHTML=cuenta(); },1000);
  setInterval(()=>{ if(SCR==="pass"&&TAB==="pass") render(); },30000);
  setInterval(flush,15000);
  window.addEventListener("online",flush);
})();
</script>
