<style>
:root{
  --bg:#FFFFFF; --bg2:#F4F2EE; --card:#FFFFFF; --card2:#F1EFEB;
  --line:rgba(31,23,36,.13);
  --tx:#1F1724; --tx2:#5C5169; --tx3:#8C8299;
  --sh:0 2px 12px rgba(31,23,36,.07);
  --red:#FF2D20; --org:#FF7A00; --yel:#FFC800; --lim:#A6E022; --grn:#00B050; --tea:#00C4B4; --pnk:#FF3D8F; --vio:#8B5CF6;
  --ok:#16A34A; --warn:#FFC319; --bad:#E8342B;
  --r:22px; --r2:16px; --r3:12px;
  --pad: max(14px, env(safe-area-inset-left));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-weight:600; font-size:16px; line-height:1.35;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
input,select,textarea,button{font-family:inherit;font-weight:700;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:0 var(--pad)}

/* HEADER */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#FFFFFF 72%,rgba(255,255,255,0));padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.hd img{width:40px;height:40px;border-radius:12px;flex:0 0 auto;box-shadow:0 4px 14px rgba(232,52,43,.35)}
.hd h1{font-size:19px;margin:0;letter-spacing:-.4px;font-weight:800;line-height:1}
.hd p{margin:3px 0 0;font-size:11.5px;color:var(--tx3);font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.hd .who{margin-left:auto;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--tx2);max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx3);margin-right:6px;vertical-align:1px}
.syncdot.on{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.syncdot.local{background:var(--yel)}
.syncdot.pend{background:var(--org);box-shadow:0 0 8px var(--org)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.card .sub{margin:0 0 14px;font-size:12.5px;color:var(--tx3);font-weight:700}
.sect{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);font-weight:800;margin:22px 2px 10px}

/* COUNTDOWN */
.cd{background:linear-gradient(135deg,#E8342B,#FF7A1A 48%,#FFC319);border-radius:var(--r);padding:18px;color:#1A1014;margin-bottom:14px;position:relative;overflow:hidden}
.cd b{display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;opacity:.72;font-weight:800}
.cd .big{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.cd .wh{font-size:13.5px;font-weight:800;opacity:.78}

/* STATS */
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px;box-shadow:var(--sh)}
.stat .k{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);font-weight:800;margin-bottom:5px}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.stat .u{font-size:11.5px;color:var(--tx3);margin-top:4px;font-weight:700}
.stat.acc{background:linear-gradient(140deg,#FFF7EF,#FFFFFF)}
.v.red{color:#F01B0E}.v.grn{color:#009A45}.v.yel{color:#C58A00}.v.tea{color:#00A99B}.v.pnk{color:#F0137A}.v.org{color:#F26B00}.v.vio{color:#7C3AED}

/* BARS */
.bar{height:11px;border-radius:999px;background:rgba(31,23,36,.085);overflow:hidden;margin:9px 0 0}
.bar i{display:block;height:100%;border-radius:999px;transition:width .35s ease}
.split{display:flex;height:34px;border-radius:999px;overflow:hidden;margin:12px 0 8px;background:rgba(31,23,36,.07)}
.split i{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#FFFFFF;transition:width .35s ease;white-space:nowrap;overflow:hidden}

/* FORMS */
.row{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.row .sm{flex:0 0 92px}
.row .xs{flex:0 0 70px}
input,select,textarea{
  width:100%;background:var(--bg2);border:1.5px solid var(--line);color:var(--tx);
  border-radius:var(--r3);padding:12px 13px;outline:none;transition:border-color .15s;
}
textarea{min-height:76px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--org)}
input::placeholder,textarea::placeholder{color:var(--tx3);font-weight:600}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
label.lb{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:800;margin:0 0 5px 3px}

/* BUTTONS */
button{border:none;border-radius:var(--r3);padding:13px 16px;background:var(--card2);color:var(--tx2);cursor:pointer;transition:transform .1s,filter .15s}
button:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,var(--red),var(--org));color:#fff;font-weight:800;box-shadow:0 5px 16px rgba(232,52,43,.3)}
.btn-g{background:linear-gradient(135deg,var(--grn),var(--tea));color:#fff;font-weight:800}
.btn-y{background:linear-gradient(135deg,var(--yel),var(--org));color:#3A2406;font-weight:800}
.btn-w{width:100%}
.btn-s{padding:9px 13px;font-size:13.5px;border-radius:11px}
.btn-gh{background:transparent;border:1.5px solid var(--line);color:var(--tx2)}
.btn-x{background:rgba(232,52,43,.10);color:#C8271E;padding:9px 11px;font-size:13px;border-radius:10px;flex:0 0 auto}

/* LISTS */
ul.lst{list-style:none;margin:12px 0 0;padding:0}
ul.lst li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid rgba(31,23,36,.07);border-radius:var(--r2);padding:11px 12px;margin-bottom:8px}
.li-main{flex:1 1 auto;min-width:0}
.li-t{font-size:15px;font-weight:800;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-s{font-size:12px;color:var(--tx3);font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-n{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.qin{width:72px;text-align:center;padding:6px 4px;border:1px solid rgba(128,128,128,.35);border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:17px;font-weight:800}
.qsteps{flex:1 1 100%;display:flex;gap:6px;margin-top:6px}.qsteps button{flex:1 1 0;padding:8px 0}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:22px 10px;font-weight:700}

/* PILLS */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.p-m{background:rgba(0,196,180,.18);color:#00897E}
.p-f{background:rgba(255,61,143,.16);color:#D40F67}
.p-q{background:rgba(255,195,25,.22);color:#9A6B05}
.p-ok{background:rgba(0,176,80,.16);color:#00913F}
.p-mid{background:rgba(255,195,25,.22);color:#9A6B05}
.p-bad{background:rgba(255,45,32,.14);color:#E01A0C}
.p-n{background:rgba(31,23,36,.06);color:var(--tx2)}
.p-vio{background:rgba(139,92,246,.16);color:#6D28D9}
.p-vip{background:linear-gradient(135deg,rgba(255,200,0,.3),rgba(255,122,0,.3));color:#9A5B00}
.btn-vip{background:linear-gradient(135deg,#FFC800,#FF7A00);color:#3A2406;font-weight:800}
.btn-pvip{background:linear-gradient(135deg,#8B5CF6,#FF3D8F);color:#fff;font-weight:800}
.btn-dng{background:#FF2D20;color:#fff;font-weight:800}
.btn-weed{background:linear-gradient(135deg,#00B050,#A6E022);color:#13330E;font-weight:800}
.p-weed{background:rgba(0,176,80,.16);color:#00913F}
.p-pvip{background:rgba(139,92,246,.18);color:#6D28D9}
.v.vip{color:#E08A00}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;background:var(--card);border:1.5px solid var(--line);color:var(--tx2);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--red),var(--org));color:#fff;border-color:transparent}
.tog{display:flex;gap:0;background:var(--card2);border:1.5px solid var(--line);border-radius:999px;padding:3px;flex:1 1 0}
.tog button{flex:1;padding:9px 4px;font-size:13px;border-radius:999px;background:transparent;color:var(--tx3);font-weight:800}
.tog button.on{background:#FFFFFF;color:var(--tx);box-shadow:0 1px 4px rgba(31,23,36,.12)}

/* TIMELINE */
.tl{position:relative;padding-left:26px;margin-top:12px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2.5px;border-radius:2px;background:linear-gradient(180deg,var(--red),var(--org),var(--yel),var(--grn))}
.tl .ev{position:relative;margin-bottom:14px}
.tl .ev:before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--org);border:2.5px solid var(--card)}
.tl .ev.done:before{background:var(--grn)}
.tl .ev.late:before{background:var(--red);box-shadow:0 0 9px var(--red)}
.tl .d{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:800}
.tl .t{font-size:14.5px;font-weight:800;margin-top:2px}

/* NAV */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding:7px 8px}
.navs::-webkit-scrollbar{display:none}
.navs button{position:relative;flex:0 0 auto;background:transparent;padding:7px 11px;border-radius:14px;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px}
.navs button .ic{font-size:19px;line-height:1}
.navs button .lb2{font-size:10px;font-weight:800;letter-spacing:.2px}
.navs button.on{background:var(--card2);color:var(--tx)}
.navs button.on .lb2{color:var(--tx)}
.navs button.on .ic{filter:saturate(1.4)}
.badge{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 5px}

.gpins{display:flex;gap:12px;justify-content:center;margin:16px 0 20px}
.gpins i{width:15px;height:15px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .14s,background .14s}
.gpins i.f{background:var(--tx);box-shadow:none;transform:scale(1.12)}
.gpins.bad i{background:#FDE2E0;box-shadow:inset 0 0 0 1.5px rgba(232,52,43,.45)}
@keyframes gshk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.gpins.bad{animation:gshk .4s}
.gkp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:300px;margin:0 auto}
.gkp button{padding:15px 0;border-radius:15px;background:var(--bg2);box-shadow:var(--sh);font-size:22px;font-weight:800}
.gkp button:active{background:var(--card2)}
.gkp button.z{background:transparent;box-shadow:none;font-size:14px;font-weight:800;color:var(--tx2)}
.hide{display:none!important}
.ring{flex:0 0 auto;display:block}
.invrow{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid rgba(31,23,36,.07);border-radius:var(--r2);padding:11px 12px;margin-bottom:8px}
.invrow .im{flex:1 1 auto;min-width:0}
.mk{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 4px;margin-left:3px;vertical-align:1px}
.mk.ok{background:rgba(0,176,80,.18);color:#00913F}
.mk.vip{background:linear-gradient(135deg,#FFC800,#FF7A00);color:#3A2406;letter-spacing:.3px}
.mk.pvip{background:linear-gradient(135deg,#8B5CF6,#FF3D8F);color:#fff}
.mk.dng{background:#FF2D20;color:#fff;letter-spacing:.5px}
.mk.noc{background:rgba(31,23,36,.1);color:var(--tx3)}
.nick{font-weight:700;color:var(--vio);font-size:13.5px}
.mk.r{background:rgba(0,176,80,.14);color:#00913F}
.mk.d{background:rgba(255,122,0,.16);color:#C55A00}
.mk.wd{background:rgba(0,176,80,.16)}
.mk.fl{background:rgba(255,195,25,.2)}
.mk.ig{background:rgba(219,39,119,.12);color:#BE185D}
.mk.wa{background:rgba(13,148,136,.13);color:#0B7268}
.mk.nm{background:rgba(124,58,237,.12);color:#6D28D9}
.donutwrap{position:relative;width:150px;margin:6px auto 2px}
.donut{width:150px;height:150px;display:block}
.dctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dctr b{font-size:21px;font-weight:800;letter-spacing:-.8px;line-height:1}
.dctr span{font-size:10.5px;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.dleg{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:12px}
.dleg span{font-size:11.5px;font-weight:800;color:var(--tx2);display:flex;align-items:center;gap:6px}
.dleg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.qq{border-radius:var(--r2);padding:11px;border:1.5px solid var(--line);background:var(--bg2);min-height:92px}
.qq h4{margin:0 0 2px;font-size:12px;font-weight:800;letter-spacing:.3px}
.qq .n{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1}
.qq .t{font-size:11px;color:var(--tx3);font-weight:700;margin-top:6px;line-height:1.4;overflow:hidden}
.q1{background:rgba(232,52,43,.07);border-color:rgba(232,52,43,.3)}
.q2{background:rgba(20,184,166,.07);border-color:rgba(20,184,166,.3)}
.q3{background:rgba(255,195,25,.1);border-color:rgba(255,195,25,.4)}
.q4{background:var(--bg2)}
.msg{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;margin-bottom:8px}
.msg .mh{font-size:11.5px;font-weight:800;color:#6D28D9;margin-bottom:4px}
.msg .mb{font-size:14px;font-weight:600;line-height:1.45;white-space:pre-wrap}
.msg.mine{background:rgba(124,58,237,.06);border-color:rgba(124,58,237,.22)}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;padding:0 var(--pad) 40px;padding-top:calc(env(safe-area-inset-top) + 26px)}
.gate .gi{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.gate .gi img{width:52px;height:52px;border-radius:16px}
.gate h2{font-size:22px;margin:0;font-weight:800;letter-spacing:-.5px}
.gate p.g2{margin:3px 0 0;font-size:13px;color:var(--tx3);font-weight:700}
.gate .u{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r2);padding:14px;margin-bottom:9px;box-shadow:var(--sh)}
.gate .u .cd2{flex:0 0 62px;font-size:11.5px;font-weight:800;color:#6D28D9;background:rgba(124,58,237,.11);border-radius:999px;padding:5px 0;text-align:center}
.gate .u .nm{flex:1;font-size:17px;font-weight:800;color:var(--tx);letter-spacing:-.2px}
.gate .u .ad{font-size:10.5px;font-weight:800;color:#9A6B05;background:rgba(255,195,25,.22);border-radius:999px;padding:4px 9px}
.flexline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono{font-variant-numeric:tabular-nums}
.tiny{font-size:11.5px;color:var(--tx3);font-weight:700;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#241C31;border:1px solid transparent;color:#FFF6EC;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:800;opacity:0;transition:.25s;z-index:99;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
/* --- secciones colapsables --- */
.cabz{display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.cabz h2{margin:0}
.caret{flex:0 0 auto;font-size:13px;color:var(--tx3);transition:transform .16s;transform:rotate(-90deg);padding:3px 0 0}
.caret.ab{transform:rotate(0)}
/* --- heatmap de altas por hora --- */
.hmx{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px}
table.hm{border-collapse:separate;border-spacing:1.5px}
.hm td{padding:0}
.hm .hmh{font-size:8.5px;font-weight:800;color:var(--tx3);text-align:center;height:10px;min-width:12px}
.hm .hmd{font-size:9.5px;font-weight:800;color:var(--tx2);padding-right:5px;white-space:nowrap;text-align:right}
.hm .hmc{width:12px;height:12px;border-radius:3px;font-size:7.5px;font-weight:800;text-align:center;line-height:12px;background:var(--card2)}
.hm .hmt{font-size:10px;font-weight:800;color:var(--tx2);padding-left:5px;text-align:right}
/* --- el QR visto desde el consejo --- */
.qrbox{display:inline-block;padding:9px;border-radius:14px;border:3px solid var(--line);background:#fff;line-height:0}
.qrbox.ok{border-color:var(--grn)}
.qrbox.no{border-color:var(--red)}
.qrbox.vip{border-color:#FFB300;box-shadow:0 0 0 1px rgba(255,179,0,.35)}
.qrbox.pvip{border-color:var(--vio);box-shadow:0 0 0 1px rgba(139,92,246,.35)}
.qrbox table{border-collapse:collapse}
.qrbox td{width:var(--c);height:var(--c);padding:0}
.qrbox td.d{background:#1F1724}
.qrsin{display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;font-weight:800;
  color:var(--tx3);width:146px;height:146px;line-height:1.35;overflow-wrap:anywhere}
/* --- etiquetas libres --- */
.tg{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:2px 6px;margin:0 3px 2px 0;vertical-align:1px}
.tgs{display:flex;flex-wrap:wrap;margin-top:6px}
.tgp{font-size:11.5px;font-weight:800;border-radius:999px;padding:7px 11px;background:var(--bg2);
  box-shadow:var(--sh);margin:0 6px 6px 0;color:var(--tx2)}
.tgp.on{color:#fff;box-shadow:none}
/* --- barras de confianza --- */
.cfb{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cfb .cl{flex:0 0 82px;font-size:10.5px;font-weight:800;color:var(--tx2)}
.cfb .ct{flex:1;height:14px;border-radius:7px;background:var(--card2);overflow:hidden}
.cfb .ct i{display:block;height:100%}
.cfb .cn{flex:0 0 32px;text-align:right;font-size:11.5px;font-weight:800}
/* --- paginación --- */
.pag{display:flex;align-items:center;gap:8px;margin-top:10px}
.pag .pt{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:var(--tx2)}

</style>
</head>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {

      }

      if (_dataCache == null) {

      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

  const n=norm(full); if(!n) return "?";

    if(FS.has(t)) return "F";

}

function migSup(s){
  const MAP={beer:"cerveza",cup:"vasos",iceKg:"hielo",shot:"alcohol",snack:"botana",mix:"mixer",fix:"otro"};
  const r=s.ratios||{}, p=(s.guests||[]).filter(g=>g.conf==="si").length + Math.round((s.guests||[]).filter(g=>g.conf==="tal").length*0.5);

      stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" transform="rotate(-90 32 32)"></circle>
    <text x="32" y="37" text-anchor="middle" font-size="16" font-weight="800" fill="${col}">${txt}</text></svg>`;
}
function countdown(){
  const t=new Date(S.meta.when).getTime()-Date.now();
  if(t<=0) return {txt:"EN CURSO",sub:"el evento ya empezo",ms:t};
  const d=Math.floor(t/864e5), h=Math.floor(t/36e5)%24, m=Math.floor(t/6e4)%60;
  return {txt:(d?d+"d ":"")+h+"h "+String(m).padStart(2,"0")+"m", sub:"", ms:t};

/* ---------- progreso real ---------- */
function progreso(){
  const st=stats();
  let sup=null;
  if(S.supplies.length){
    let acc=0;
    S.supplies.forEach(s=>{ const t=targetOf(s); acc += t>0 ? Math.min(1,(+s.qty||0)/t) : 1; });
    sup=acc/S.supplies.length*100;
  }
  const tk=S.tasks.length? S.tasks.filter(t=>t.done).length/S.tasks.length*100 : null;
  const mn=st.goal>0? Math.min(100,st.inn/st.goal*100) : null;
  const parts=[sup,tk,mn].filter(v=>v!==null);
  return {sup,tk,mn,total: parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : 0};
}
/* ---------- dona svg ---------- */
function donut(segs,centro,pie){
  const R=52, C=2*Math.PI*R;
  const tot=segs.reduce((a,s)=>a+Math.max(0,s.v),0)||1;
  let off=0;
  const arcs=segs.map(s=>{
    const len=Math.max(0,s.v)/tot*C;
    const el=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${s.c}" stroke-width="17" stroke-linecap="butt"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"></circle>`;
    off+=len; return el;
  }).join("");
  return `<div class="donutwrap">
    <svg viewBox="0 0 140 140" class="donut">
      <circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(31,23,36,.07)" stroke-width="17"></circle>
      ${arcs}
    </svg>
    <div class="dctr"><b>${centro}</b><span>${pie}</span></div>
  </div>
  <div class="dleg">${segs.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.k)} ${money(s.v)}</span>`).join("")}</div>`;
}

function metioDe(id){ return S.money.filter(m=>m.userId===id&&m.kind==="in").reduce((a,b)=>a+(+b.amount||0),0); }
function deudaDe(c){ return (+c.debt||0) + Math.max(0, gastoDe(c.id)-(+c.budget||0)); }
function saldoCartera(w){

/* ============================================================
   HEATMAP DE ALTAS POR HORA
   Un renglón por día, una columna por hora del día.
   ============================================================ */
function heatCeldas(L){
  const cel={}, dias=[];
  Object.keys(L||{}).forEach(g=>{
    const t=+((L[g]||{}).ts)||0; if(!t) return;
    const d=new Date(t);
    const dk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const k=dk+"|"+d.getHours();
    cel[k]=(cel[k]||0)+1;
    if(dias.indexOf(dk)<0) dias.push(dk);
  });
  dias.sort();
  let max=0; Object.keys(cel).forEach(k=>{ if(cel[k]>max) max=cel[k]; });
  return {cel:cel, dias:dias, max:max};
}
function heatHoras(L){
  const H=heatCeldas(L);
  if(!H.dias.length) return `<div class="empty">Todavía nadie saca su pase</div>`;
  const hrs=[]; for(let h=0;h<24;h++) hrs.push(h);
  const etq=dk=>{ const d=new Date(dk+"T12:00");
    return d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric"}).replace(/\./g,""); };
  const tono=v=>{ if(!v) return ""; const t=H.max?v/H.max:0;
    return "background:rgba(255,122,0,"+(0.18+t*0.82).toFixed(2)+");color:"+(t>0.5?"#fff":"#8A4100"); };
  return `<div class="hmx"><table class="hm">
    <tr><td class="hmh"></td>${hrs.map(h=>`<td class="hmh">${h%3===0?String(h).padStart(2,"0"):""}</td>`).join("")}<td class="hmh" style="padding-left:5px">tot</td></tr>
    ${H.dias.map(dk=>`<tr><td class="hmd">${etq(dk)}</td>${hrs.map(h=>{
        const v=H.cel[dk+"|"+h]||0;
        return `<td class="hmc" style="${tono(v)}" title="${etq(dk)} ${String(h).padStart(2,"0")}:00 · ${v}">${v||""}</td>`;
      }).join("")}<td class="hmt">${hrs.reduce((a,h)=>a+(H.cel[dk+"|"+h]||0),0)}</td></tr>`).join("")}
  </table></div>
  <div class="tiny" style="margin-top:7px">cada cuadro es una hora · la hora más alta fueron ${H.max} pase${H.max===1?"":"s"}</div>`;
}

function qrTexto(gid){

function qrHTML(gid){
  const st=qrEstado(gid);
  if(st.k==="no") return `<div class="qrbox no"><div class="qrsin">sin pase<br>no ha sacado su código</div></div>`;
  const txt=qrTexto(gid);
  try{
    const q=qrcode(0,"M"); q.addData(txt); q.make();
    const n=q.getModuleCount(), c=Math.max(3,Math.min(6,Math.floor(150/n)));
    let t=`<table style="--c:${c}px">`;
    for(let r=0;r<n;r++){ t+="<tr>";
      for(let k=0;k<n;k++) t+='<td class="'+(q.isDark(r,k)?"d":"")+'"></td>';
      t+="</tr>"; }
    return `<div class="qrbox ${st.k}">${t}</table></div>`;

function vTimeline(){

function fmtD(iso){
  try{const d=new Date(iso+"T12:00");return d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"}).toUpperCase();}catch(e){return iso;}
}

let GF={q:"",sex:"",conf:"",sort:"az",trust:"",tag:""};
function gFiltered(){
  const q=norm(GF.q||"").trim(), so={F:0,M:1,"?":2}, co={si:0,tal:1,no:2};
  const az=(a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"});
  const cmp={az, za:(a,b)=>-az(a,b),
    sexF:(a,b)=>(so[a.sex]-so[b.sex])||az(a,b),
    sexM:(a,b)=>(((a.sex==="M"?0:a.sex==="F"?1:2))-((b.sex==="M"?0:b.sex==="F"?1:2)))||az(a,b),
    conf:(a,b)=>((co[a.conf]??3)-(co[b.conf]??3))||az(a,b),
    new:(a,b)=>(b.ts||0)-(a.ts||0)||az(a,b), old:(a,b)=>(a.ts||0)-(b.ts||0)||az(a,b),
    pts:(a,b)=>puntos(b)-puntos(a)||az(a,b),
    resp:(a,b)=>((+b.resp||0)-(+a.resp||0))||az(a,b),
    deps:(a,b)=>((+b.deps||0)-(+a.deps||0))||az(a,b)}[GF.sort]||az;
  const EX={vip:g=>!!g.vip, pvip:g=>!!g.pvip, flag:g=>!!g.flag, danger:g=>!!g.danger, smoke:g=>!!g.smoke, nocon:g=>!!g.nocon, known:g=>puntos(g)>0};
  const okSex=g=> !GF.sex ? true : (EX[GF.sex] ? EX[GF.sex](g) : g.sex===GF.sex);
  const okTrust=g=> GF.trust==="" ? true : nivelConf(g)===+GF.trust;
  const okTag=g=> !GF.tag ? true : tagsDe(g).indexOf(GF.tag)>=0;
  return S.guests.filter(g=>okSex(g)&&okTrust(g)&&okTag(g)&&(!GF.conf||g.conf===GF.conf)&&(!q||norm(g.name).includes(q)||norm(g.nick||"").includes(q)||norm(g.full||"").includes(q))).sort(cmp);
}

let CU=null;
function vFichaCrew(c){
  const g=gastoDe(c.id), b=+c.budget||0, deuda=+c.debt||0;
  const exceso=Math.max(0,g-b);
  return `
  <button class="btn-gh btn-w btn-s" id="cuBack" style="margin-bottom:12px">← Volver al consejo</button>
  <div class="card">
    <h2>${esc(c.name)}</h2>
    <p class="sub">${esc(c.code||"")}${c.admin?" · administrador":""}</p>
    <div class="grid g3">
      <div class="stat"><div class="k">Presupuesto</div><div class="v">${money(b)}</div><div class="u">${c.src==="propio"?"dinero suyo":"de la caja"}</div></div>
      <div class="stat"><div class="k">Ha gastado</div><div class="v red">${money(g)}</div><div class="u">${b?Math.round(g/b*100)+"% del tope":"sin tope"}</div></div>
      <div class="stat"><div class="k">Se le debe</div><div class="v ${deuda+exceso?"yel":"grn"}">${money(deuda+exceso)}</div><div class="u">${exceso?"excedió "+money(exceso):"sin exceso"}</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Editar</h2>
    <label class="lb">Nombre</label><div class="row"><input id="cuName" value="${esc(c.name)}"></div>
    <label class="lb">Encargo</label><div class="row"><input id="cuRole" value="${esc(c.role||"")}"></div>
    <div class="row">
      <div><label class="lb">Presupuesto $</label><input id="cuBud" type="number" inputmode="decimal" value="${b||""}"></div>
      <div><label class="lb">Origen</label><select id="cuSrc">
        <option value="caja"${c.src!=="propio"?" selected":""}>Dinero de la caja</option>
        <option value="propio"${c.src==="propio"?" selected":""}>Dinero suyo</option>
      </select></div>
    </div>
    <label class="lb">Deuda registrada a mano $</label>
    <div class="row"><input id="cuDebt" type="number" inputmode="decimal" value="${deuda||""}" placeholder="lo que puso de más"></div>
    <button class="btn-p btn-w" data-cusave="${c.id}">Guardar</button>
    ${exceso?`<button class="btn-y btn-w btn-s" data-cuabs="${c.id}" style="margin-top:9px">Pasar el exceso de ${money(exceso)} a deuda</button>`:""}
  </div>
  <div class="card">
    <h2>Sus movimientos</h2>
    ${S.money.filter(m=>m.userId===c.id).length?`<ul class="lst">${S.money.filter(m=>m.userId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(m=>`
      <li><span class="pill ${m.kind==="in"?"p-ok":"p-bad"}">${m.kind==="in"?"+":"−"}</span>
      <div class="li-main"><div class="li-t">${esc(m.concept||"sin concepto")}</div><div class="li-s">${fmtD(m.date||todayISO())}</div></div>
      <div class="li-n" style="color:${m.kind==="in"?"#15803D":"#C8271E"}">${money(m.amount)}</div></li>`).join("")}</ul>`:`<div class="empty">Sin movimientos</div>`}
  </div>`;
}

function vEquipo(){
  if(CU){ const c=S.crew.find(x=>x.id===CU); if(c) return vFichaCrew(c); CU=null; }
  const totalDeuda=S.crew.reduce((a,c)=>a+(+c.debt||0)+Math.max(0,gastoDe(c.id)-(+c.budget||0)),0);
  const totalPre=S.crew.reduce((a,c)=>a+(+c.budget||0),0);
  return `
  <div class="grid g3">
    <div class="stat acc"><div class="k">Consejo</div><div class="v">${S.crew.length}</div><div class="u">integrantes</div></div>
    <div class="stat"><div class="k">Presupuestos</div><div class="v">${money(totalPre)}</div><div class="u">asignados</div></div>
    <div class="stat"><div class="k">Se les debe</div><div class="v ${totalDeuda?"yel":"grn"}">${money(totalDeuda)}</div><div class="u">por reponer</div></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Alta en el consejo</h2>
    <p class="sub">ID sin contraseña, solo para asignar</p>
    <div class="row"><input id="cName" placeholder="Nombre"><input id="cCode" placeholder="ID" class="sm"></div>
    <div class="row"><input id="cRole" placeholder="Encargo (ej. alcohol, deco, música)"><input id="cBud" type="number" inputmode="decimal" placeholder="Budget $" class="sm"></div>
    <button class="btn-p btn-w" id="cAdd">Agregar</button>
  </div>

  <div class="card">
    <h2>Integrantes</h2>
    <p class="sub">toca a alguien para editar su presupuesto y su deuda</p>
    ${S.crew.length?`<ul class="lst">${S.crew.map(c=>{
      const g=gastoDe(c.id), b=+c.budget||0, p=b?Math.min(100,g/b*100):0;
      const deuda=(+c.debt||0)+Math.max(0,g-b);
      return `<li style="flex-wrap:wrap" data-cuopen="${c.id}">
        <span class="pill p-vio">${esc(c.code||"—")}</span>
        <div class="li-main"><div class="li-t">${esc(c.name)}${c.id===ME?" (tú)":""}</div>
        <div class="li-s">${esc(c.role||"sin encargo")} · ${c.src==="propio"?"pone de lo suyo":"usa caja"}</div></div>
        <div class="li-n">${money(g)}</div>
        <button class="btn-x" data-del-c="${c.id}">✕</button>
        ${b?`<div style="flex:1 1 100%"><div class="bar"><i style="width:${p}%;background:${g>b?"var(--red)":colorPct(100-p)}"></i></div>
        <div class="tiny" style="margin-top:5px">${money(g)} de ${money(b)}${g>b?" · excedió "+money(g-b):" · le quedan "+money(b-g)}</div></div>`:""}
        ${deuda?`<div class="tiny" style="flex:1 1 100%;color:#9A6B05;margin-top:4px">Se le deben ${money(deuda)}</div>`:""}
      </li>`;}).join("")}</ul>`:`<div class="empty">Sin consejo</div>`}
  </div>`;
}

/* ---------- INSUMOS ---------- */
function vInsumos(){

  const CATS=[["cerveza","Cerveza"],["alcohol","Alcohol (destilados)"],["mixer","Mixer / refresco"],["vasos","Vasos y desechables"],["hielo","Hielo"],["botana","Botana"],["otro","Otro"]];
  const nec=necesidades(st.people);
  const inv=S.supplies||[];
  const cob=s=>{ const t=targetOf(s); return t>0? Math.min(100,(+s.qty||0)/t*100) : 100; };
  const global=inv.length? inv.reduce((a,s)=>a+cob(s),0)/inv.length : 0;

  return `
  <div class="card">
    <h2>Inventario general</h2>
    <p class="sub">${inv.length} partidas · cobertura promedio ${Math.round(global)}%</p>
    <div style="display:flex;justify-content:center;margin:4px 0 14px">${ring(global,Math.round(global)+"%",104)}</div>
    ${inv.length?inv.slice().sort((a,b)=>cob(a)-cob(b)).map(s=>{
      const t=targetOf(s), q=+s.qty||0, p=cob(s);
      return `<div class="invrow">
        ${ring(p,Math.round(p)+"",54)}
        <div class="im"><div class="li-t">${esc(s.name)}</div>
        <div class="li-s">${q} de ${t||"—"} ${esc(s.unit||"")}${t&&q<t?" · faltan "+(t-q):t?" · completo":""}${typeof promTxt==="function"?promTxt(s):""}</div></div>
      </div>`;}).join(""):`<div class="empty">Sin insumos todavía</div>`}
  </div>

  <div class="card">
    <h2>Agregar insumo</h2>
    <div class="row"><input id="sName" placeholder="Qué es (ej. Tequila 1L)"><input id="sUnit" placeholder="Unidad" class="xs" value="pz"></div>
    <div class="row"><select id="sCat">${CATS.map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
    <div class="row">
      <input id="sQty" type="number" inputmode="decimal" placeholder="Tengo">
      <input id="sTar" type="number" inputmode="decimal" placeholder="Meta">
    </div>
    <button class="btn-p btn-w" id="sAdd">Agregar insumo</button>
  </div>

  <div class="card">
    <h2>Editar insumos</h2>
    <p class="sub">cantidad y meta: escribe y pulsa Enter (acepta +N o −N)</p>
    ${inv.length?`<ul class="lst">${inv.map(s=>{
      const t=targetOf(s), q=+s.qty||0, p=cob(s);
      return `<li style="flex-wrap:wrap">
        <div class="li-main"><div class="li-t">${esc(s.name)}</div>
        <div class="li-s">${esc((CATS.find(c=>c[0]===s.cat)||["","sin categoría"])[1])}${s.who?" · "+esc(s.who):""}</div></div>
        <button class="btn-x" data-del-s="${s.id}">✕</button>
        <div style="flex:1 1 100%;display:flex;gap:8px;align-items:center;margin-top:8px">
          <div style="flex:1"><label class="lb">Tengo</label>
            <input class="qin" data-sqv="${s.id}" type="text" inputmode="numeric" enterkeyhint="done" value="${q}"></div>
          <div style="flex:1"><label class="lb">Meta</label>
            <input class="qin" data-star="${s.id}" type="text" inputmode="numeric" enterkeyhint="done" value="${t}"></div>
          <div style="flex:0 0 96px"><label class="lb">Categoría</label>
            <select data-scat="${s.id}">${CATS.map(([k,v])=>`<option value="${k}"${s.cat===k?" selected":""}>${v}</option>`).join("")}</select></div>
        </div>
        <div class="qsteps" style="flex:1 1 100%">${[-24,-6,-1,1,6,24].map(d=>`<button class="btn-s btn-gh" data-sq="${s.id}|${d}">${d>0?"+"+d:"−"+(-d)}</button>`).join("")}</div>
        <div style="flex:1 1 100%"><div class="bar"><i style="width:${p}%;background:${colorPct(p)}"></i></div></div>

  $("#view").innerHTML=(V[TAB]||vHome)();
  $("#nav").innerHTML=navHTML();
  $("#whoTxt").textContent=meName()||"entrar";
  renderGate();
  const p=qCount();
  const t=$("#syncTxt");
  if(t) t.textContent = !FBon ? "Solo en este dispositivo"
    : (online ? (p? p+" cambios subiéndose" : "Todo sincronizado · sala "+ROOM)
              : (p? "Sin conexión · "+p+" cambios guardados aquí" : "Sin conexión"));

document.addEventListener("click",e=>{
  /* encabezados que abren y cierran su bloque */
  const sc=e.target.closest("[data-sec]");
  if(sc && !e.target.closest("button") && !e.target.closest("input")
        && !e.target.closest("select") && !e.target.closest("a")){
    const pr=sc.getAttribute("data-sec").split("|");
    secTog(pr[0], pr[1]==="1"); render(); return;
  }
  const cu=e.target.closest("[data-cuopen]");
  if(cu && !e.target.closest("button")){ CU=cu.getAttribute("data-cuopen"); render(); return; }
  const gu=e.target.closest("[data-gopen]");
  if(gu && !e.target.closest("button") && !e.target.closest("a")){
    GSCROLL=window.scrollY||0; GU=gu.getAttribute("data-gopen");
    if(TAB!=="gente"){ TAB="gente"; localStorage.setItem("mngostat.tab","gente");
      history.replaceState(null,"","#gente"); }
    render(); window.scrollTo(0,0); return; }
  const th=e.target.closest("[data-thopen]");
  if(th && !e.target.closest("[data-del-th]")){ TH=th.getAttribute("data-thopen"); render(); return; }
  const gb=e.target.closest("[data-me]");
  if(gb){ setMe(gb.getAttribute("data-me")); gateOpen=false; render(); toast("Hola "+meName()); return; }
  if(e.target.closest("#whoBtn")){openGate();return;}
  const b=e.target.closest("[data-go],button"); if(!b) return;
  const g=b.getAttribute("data-go"); if(g){go(g);return;}
  const id=b.id, a=n=>b.getAttribute(n);

  /* avisos */
  if(id==="fPerm"){
    if(!window.Notification) return toast("Este navegador no soporta avisos");
    Notification.requestPermission().then(p=>{ render(); toast(p==="granted"?"Avisos activados":"Permiso no concedido"); });
    return;}

  /* entrada */
  if(id==="gNewAdd"){const n=$("#gNew").value.trim(); if(!n)return toast("Escribe tu nombre");
    const c={id:uid(),code:"MNG-"+String(S.crew.length+1).padStart(2,"0"),name:n,role:"",budget:0,admin:false};
    S.crew.push(c); setMe(c.id); gateOpen=false; save("crew","se unió "+n,c.id); toast("Hola "+n); return;}
  if(id==="gClose"){gateOpen=false; renderGate(); return;}

  /* carteras */
  if(id==="wAdd"){const wn=$("#wName").value.trim(); if(!wn) return toast("Ponle nombre");
    const nw={id:uid(),name:wn,holder:$("#wHold").value,open:+$("#wOpen").value||0,ts:Date.now()};
    S.wallets.push(nw); save("wallets","creó la cartera "+wn+" con "+money(nw.open),nw.id); toast("Cartera creada"); return;}
  if(a("data-del-w")){const wq=(S.wallets||[]).find(x=>x.id===a("data-del-w"));
    S.wallets=(S.wallets||[]).filter(x=>x.id!==a("data-del-w"));
    save("wallets","borró la cartera "+(wq?wq.name:""),a("data-del-w")); return;}

  /* gastos pendientes */
  if(id==="bAdd"){const cn=$("#bCon").value.trim(), am=+$("#bAmt").value;
    if(!cn||!am) return toast("Falta concepto o monto");
    const nb={id:uid(),concept:cn,amount:am,who:$("#bWho").value,due:$("#bDue").value,wallet:($("#bWallet")?$("#bWallet").value:""),paid:false,ts:Date.now()};
    S.bills.push(nb); save("bills","apuntó "+money(am)+" por pagar: "+cn,nb.id); toast("Apuntado"); return;}
  if(a("data-bpay")){const b2=S.bills.find(x=>x.id===a("data-bpay")); if(!b2) return;
    b2.paid=true;
    const nm2={id:uid(),kind:"out",amount:+b2.amount||0,concept:b2.concept,userId:b2.who,wallet:b2.wallet||"",date:todayISO(),by:meName()};
    S.money.push(nm2);
    save("bills","pagó "+money(b2.amount)+" de "+b2.concept,b2.id);
    save("money",undefined,nm2.id);
    toast("Registrado como gasto"); return;}
  if(a("data-del-b")){const bq=S.bills.find(x=>x.id===a("data-del-b"));S.bills=S.bills.filter(x=>x.id!==a("data-del-b"));
    save("bills","quitó el pendiente de pago "+(bq?bq.concept:""),a("data-del-b"));return;}

  /* foro */
  if(id==="thAdd"){const tt=$("#thTitle").value.trim(); if(!tt) return toast("Ponle título");
    const nth={id:uid(),title:tt,by:meName(),ts:Date.now(),done:false};
    S.threads.push(nth);
    const first=$("#thFirst").value.trim();
    save("threads","abrió el tema \u00ab"+tt+"\u00bb",nth.id);
    if(first){ const np={id:uid(),tid:nth.id,by:meName(),text:first,ts:Date.now()}; S.posts.push(np); save("posts",undefined,np.id); }
    TH=nth.id; render(); return;}

document.addEventListener("input",e=>{
  const t=e.target; if(t.id!=="gQ") return;
  GF.q=t.value; const q=norm(t.value||"").trim(); let n=0;
  const okIds=new Set(gFiltered().map(g=>g.id));
  document.querySelectorAll("#gList > li").forEach(li=>{const show=!q||(li.dataset.n||"").includes(q); li.style.display=show?"":"none"; if(show)n++;});
  const c=$("#gCount"); if(c) c.textContent=gCountTxt(okIds.size);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="aFile"&&t.files[0]){const r=new FileReader();
    r.onload=()=>{try{S=Object.assign(DEF(),JSON.parse(r.result));save();toast("Importado");}catch(x){toast("Archivo inválido");}};
    r.readAsText(t.files[0]);return;}
  if(t.dataset.gresp){const gr=S.guests.find(x=>x.id===t.dataset.gresp); if(!gr) return;
    gr.resp=+t.value||0; save("guests","puso la responsabilidad de "+gr.name+" en "+gr.resp+"/7",gr.id); return;}
  if(t.dataset.gdeps){const gd2=S.guests.find(x=>x.id===t.dataset.gdeps); if(!gd2) return;
    gd2.deps=+t.value||0; save("guests","anotó que "+gd2.deps+" personas dependen de "+gd2.name,gd2.id); return;}
  if(t.dataset.star){const s2=S.supplies.find(x=>x.id===t.dataset.star); if(!s2) return;
    const raw=String(t.value).trim().replace(",",".");
    let n2; if(/^[+−-]/.test(raw)) n2=(+s2.target||0)+(+raw.replace("−","-")||0); else n2=+raw||0;
    s2.target=Math.max(0,n2); save("supplies","puso la meta de "+s2.name+" en "+s2.target+" "+(s2.unit||""),s2.id); return;}
  if(t.dataset.scat){const s3=S.supplies.find(x=>x.id===t.dataset.scat); if(!s3) return;
    s3.cat=t.value; save("supplies","clasificó "+s3.name+" como "+t.value,s3.id); return;}
  if(t.dataset.r){S.ratios[t.dataset.r]=+t.value||0;save("ratios","cambió la proporción "+t.dataset.r+" a "+t.value);return;}
  if(t.id==="gFSex"||t.id==="gFConf"||t.id==="gSort"||t.id==="gFTrust"||t.id==="gFTag"){
    GF[{gFSex:"sex",gFConf:"conf",gSort:"sort",gFTrust:"trust",gFTag:"tag"}[t.id]]=t.value;render();return;}
  if(t.id==="rFF"||t.id==="rFT"||t.id==="rFG"){
    RF[{rFF:"f",rFT:"trust",rFG:"tag"}[t.id]]=t.value; RPAGE=0; render(); return;}
  if(t.dataset.sqv){const s=S.supplies.find(x=>x.id===t.dataset.sqv);if(!s)return;
    const v=String(t.value).trim().replace(/[−–]/g,"-").replace(",",".");const cur=+s.qty||0;let n;
    if(/^[+-]\s*\d+(\.\d+)?$/.test(v)) n=cur+parseFloat(v.replace(/\s/g,""));
    else if(/^\d+(\.\d+)?$/.test(v)) n=parseFloat(v);
    else {t.value=cur;toast("Cantidad inválida");return;}
    s.qty=Math.max(0,n);save("supplies","dejó "+s.name+" en "+s.qty+" "+s.unit,s.id);return;}
});

let gateOpen=false;

function openGate(){ gateOpen=true; renderGate(); }
function renderGate(){
  const el=$("#gate"); if(!el) return;

  el.classList.remove("hide");
  el.innerHTML=`
    <div class="gi"><img src="${ICON}" alt="">
      <div><h2>¿Quién eres?</h2><p class="g2">elige tu ID para registrar a tu nombre</p></div></div>
    ${S.crew.map(c=>`<button class="u" data-me="${c.id}">
       <span class="cd2">${esc(c.code||"—")}</span>
       <span class="nm">${esc(c.name)}</span>
       ${c.admin?`<span class="ad">ADMIN</span>`:""}
     </button>`).join("")}
    <div class="card" style="margin-top:16px">
      <h2>No estoy en la lista</h2>
      <div class="row" style="margin-top:10px"><input id="gNew" placeholder="Tu nombre"><button class="btn-p" style="flex:0 0 86px" id="gNewAdd">Entrar</button></div>
    </div>
    ${meCrew()?`<button class="btn-gh btn-w btn-s" id="gClose" style="margin-top:10px">Cancelar</button>`:""}`;
}

let FBon=false, db=null, ref=null, fns=null, muted=false, online=false;
const COLS=["meta","ratios","guests","money","crew","supplies","music","deco","tasks","log","feed","bills","threads","posts","wallets"];
const QKEY="mngostat.queue";

/* ---------- cola de cambios pendientes ---------- */
function qGet(){ try{ return JSON.parse(localStorage.getItem(QKEY))||[]; }catch(e){ return []; } }
function qSet(q){ try{ localStorage.setItem(QKEY,JSON.stringify(q.slice(-800))); }catch(e){} }
function qCount(){ return qGet().length; }
function enqueue(up){
  const q=qGet(), now=Date.now();
  Object.keys(up).forEach(p=>{
    for(let i=q.length-1;i>=0;i--) if(q[i].p===p) q.splice(i,1);
    q.push({p:p,v:up[p]===undefined?null:up[p],ts:now});
  });
  qSet(q); flush();
}
function flush(){
  if(!FBon||!ref||!online) return;
  const q=qGet(); if(!q.length) return;
  const up={}, stamp={};
  q.forEach(e=>{ up[e.p]=e.v; stamp[e.p]=e.ts; });
  up.fmt=2;
  fns.update(ref,up).then(()=>{
    qSet(qGet().filter(e=>!(e.p in stamp && e.ts<=stamp[e.p])));
    render();
  }).catch(err=>{ console.warn("envío pendiente",err); });
}
/* aplica una ruta pendiente sobre el estado local */
function applyPath(p,v){
  const i=p.indexOf("/");
  if(i<0){ if(p!=="fmt") S[p]=v; return; }
  const col=p.slice(0,i), id=p.slice(i+1);
  if(COLS.indexOf(col)<0) return;
  if(!Array.isArray(S[col])) S[col]=[];
  const k=S[col].findIndex(x=>x&&x.id===id);
  if(v===null||v===undefined){ if(k>=0) S[col].splice(k,1); }
  else if(k>=0) S[col][k]=v; else S[col].push(v);
}
function unpack(v,c){
  if(v===undefined||v===null) return undefined;
  if(c==="meta"||c==="ratios") return v;
  if(Array.isArray(v)) return v.filter(Boolean);
  return Object.keys(v).map(k=>v[k]).filter(Boolean);
}

async function initFB(){
  if(!FB.databaseURL) return;
  try{
    const SRC=[["https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm","https://cdn.jsdelivr.net/npm/firebase@10.12.0/database/+esm"],
               ["https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"]];
    let a,d;
    for(const [u1,u2] of SRC){ try{ a=await import(u1); d=await import(u2); break; }catch(err){ a=null; } }
    if(!a) throw new Error("no se pudo cargar firebase");
    const app=a.initializeApp(FB); db=d.getDatabase(app); fns=d;
    ref=d.ref(db,ROOM);
    FBon=true;
    pubInit(d);
    authInit(app);

    /* estado real de conexión */
    d.onValue(d.ref(db,".info/connected"), s=>{
      online = s.val()===true;
      if(online) flush();
      render();
    });

    let first=true;
    d.onValue(ref,snap=>{
      const v=snap.val();
      if(!v){ enqueue(Object.assign({fmt:2}, COLS.reduce((o,c)=>(o[c]=packCol(c),o),{}))); return; }
      const antes=new Set((S.feed||[]).map(f=>f.id));
      muted=true;
      COLS.forEach(c=>{ const u=unpack(v[c],c); if(u!==undefined) S[c]= (c==="meta"||c==="ratios") ? Object.assign(S[c],u) : u; });
      /* lo que aún no se ha enviado vuelve a montarse encima */
      qGet().forEach(e=>applyPath(e.p,e.v));
      const sinFolio=numerar(S).concat([]);
      const supMig=migSup(S);
      localStorage.setItem(KEY,JSON.stringify(S));
      muted=false;
      if(v.fmt!==2) enqueue(Object.assign({fmt:2}, COLS.reduce((o,c)=>(o[c]=packCol(c),o),{})));
      else if((sinFolio.length||supMig.length) && isAdmin()){
        const up={};
        sinFolio.forEach(i=>{ const g=S.guests.find(x=>x.id===i); if(g) up["guests/"+i]=g; });
        supMig.forEach(i=>{ const x=S.supplies.find(y=>y.id===i); if(x) up["supplies/"+i]=x; });
        up.meta=S.meta; enqueue(up);
      }
      render();
      if(!first){
        const nuevos=(S.feed||[]).filter(f=>!antes.has(f.id)&&f.who!==meName());
        if(nuevos.length){
          const u=nuevos[nuevos.length-1];
          const yo=meName();
          const mio = yo && nuevos.some(f=>f.text.indexOf(yo)>=0);
          const txt=(mio?"Para ti · ":"")+u.who+" "+u.text+(nuevos.length>1?" (+"+(nuevos.length-1)+" más)":"");
          toast(txt); notify(txt);
        }
      }
      first=false;
    });
    render();
  }catch(e){ FBon=false; console.warn("sync off",e); }
}
window.addEventListener("online",()=>{ flush(); render(); });
window.addEventListener("offline",()=>{ online=false; render(); });

function pubInit(d){

async function pubWrite(up,callado){
  if(!PUBon||!db){ if(!callado) avisoErr("Sin conexión con la base"); return false; }

    await fns.update(fns.ref(db,ROOMP),up);

  }catch(e){
    const m=String((e&&(e.message||e.code))||e);
    avisoErr(/permission|denied/i.test(m)
      ? "Firebase rechazó la escritura. Faltan las reglas de antromango4_pub en la consola."
      : "No se pudo escribir: "+m.slice(0,110));
    PUBAUTO=false;     /* se corta el reintento solo hasta que lo pidas a mano */
    return false;

}
/* el mismo aviso no se repite más de una vez cada quince segundos */
function avisoErr(t){

}

/* ---------- lo que se publica a los invitados ---------- */
function pubRoster(){
  const o={};
  (S.guests||[]).forEach(g=>{ if(!g||!g.id) return;
    o[g.id]={num:+g.num||0,name:g.name||"",nick:g.nick||"",full:g.full||"",
             vip:g.vip?1:0,pvip:g.pvip?1:0}; });
  return o;
}
function pubNeeds(){
  const o={};
  (S.supplies||[]).forEach(s=>{ if(!s||!s.id) return;
    o[s.id]={name:s.name||"",unit:s.unit||"",cat:s.cat||"",qty:+s.qty||0,target:targetOf(s)||0}; });
  return o;
}
function pubReglas(){ return String((S.meta&&S.meta.rules)||""); }

/* firma barata del contenido publicable, para saber si cambió */
function pubFirma(){
  const r=pubRoster(), n=pubNeeds();
  let t=Object.keys(r).sort().map(k=>k+":"+r[k].num+r[k].name+r[k].nick+r[k].vip+r[k].pvip).join("|")+
        "#"+Object.keys(n).sort().map(k=>k+":"+n[k].name+n[k].qty+n[k].target+n[k].unit+n[k].cat).join("|")+
        "#"+pubReglas();
  let h=0x811c9dc5;
  for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h.toString(16)+"."+Object.keys(r).length+"."+Object.keys(n).length;
}
function pubPendiente(){
  const r=pubRoster();
  const pub=PUB.roster||{};
  let nuevos=0, cambiados=0;
  Object.keys(r).forEach(k=>{
    const a=r[k], b=pub[k];
    if(!b) nuevos++;
    else if(b.name!==a.name||b.nick!==a.nick||+b.num!==+a.num||(b.vip?1:0)!==a.vip||(b.pvip?1:0)!==a.pvip) cambiados++;
  });
  const sobran=Object.keys(pub).filter(k=>!r[k]).length;
  const reglas=pubReglas()!==String(PUB.reglas||"");
  const insumos=JSON.stringify(pubNeeds())!==JSON.stringify(PUB.needs||{});
  return {nuevos,cambiados,sobran,reglas,insumos,
          total:nuevos+cambiados+sobran+(reglas?1:0)+(insumos?1:0)};
}
async function pubPublicar(silencio){
  const r=pubRoster(), n=pubNeeds(), g=pubReglas();
  const ok=await pubWrite({roster:r,needs:n,reglas:g},silencio);
  if(!ok){ if(silencio){ PUBAUTO=false; render(); } return false; }
  PUBAUTO=true;
  PUB.roster=r; PUB.needs=n; PUB.reglas=g; PUBSIG=pubFirma();
  if(!silencio){
    save("supplies","publicó al registro "+Object.keys(r).length+" invitados y "+Object.keys(n).length+" insumos",[]);
    toast("Publicado · "+Object.keys(r).length+" invitados");
  }
  render();
  return true;
}
/* la lista se mantiene al día sola: si el administrador cambia algo
   publicable, se vuelve a mandar unos segundos después */
function pubAuto(){
  if(!PUBAUTO) return;          /* si una publicación falló, no se reintenta sola */
  if(!PUBon||!online||!isAdmin()) return;
  if(!Object.keys(PUB.roster||{}).length) return;   /* la primera vez se publica a mano */
  const f=pubFirma();
  if(f===PUBSIG) return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(async()=>{
    if(pubFirma()===PUBSIG) return;
    const ok=await pubPublicar(true);
    if(ok) toast("Lista actualizada en el registro");
  },2500);
}

/* ------------------------------------------------------------
   Cambiar el código de alguien sin tocarle el NIP.
   El contenido del QR lleva un testigo al final. Al generar uno
   nuevo, el código anterior, y cualquier captura que ande
   circulando, dejan de coincidir y el lector los rechaza.
   ------------------------------------------------------------ */
function tokGen(){
  return Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,6);
}
async function pubNuevoTok(gid){
  const lv=(PUB.live||{})[gid];
  const nom=((PUB.roster||{})[gid]||lv||{}).name||"";
  if(!lv){ toast("Esa persona todavía no saca su pase"); return; }
  if(!confirm("Cambiar el código de "+nom+".\n\nEl QR anterior deja de servir en la puerta, incluidas las capturas "+
              "de pantalla que ande circulando. Conserva su NIP: ve el código nuevo al volver a abrir su pase.")) return;
  const borraEntrada = !!(lv.entry&&lv.entry.ts) &&
    confirm("Ya hay una entrada registrada a su nombre.\n\nBorrarla también, para que la persona correcta pueda entrar.");
  const tok=tokGen(), ts=Date.now();
  const up={}; up["live/"+gid+"/tok"]=tok; up["live/"+gid+"/tokts"]=ts;
  if(borraEntrada) up["live/"+gid+"/entry"]=null;
  const ok=await pubWrite(up);
  if(!ok) return;
  PUB.live[gid].tok=tok; PUB.live[gid].tokts=ts;
  if(borraEntrada) delete PUB.live[gid].entry;
  save("supplies","cambió el código del pase de "+nom+(borraEntrada?" y borró su entrada":""),[]);
  toast("Código nuevo. El anterior ya no entra."); render();
}
async function pubResetPase(gid){

  if(!confirm("Borrar el pase de "+nom+". Va a tener que registrarse otra vez y elegir un NIP nuevo.")) return;

}

/* ---------- lector de códigos ---------- */
function cargaJsQR(){
  if(window.jsQR) return Promise.resolve();
  const U=["https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
           "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"];
  return new Promise((res,rej)=>{
    let i=0;
    const tryOne=()=>{
      if(i>=U.length) return rej(new Error("no cargó"));
      const sc=document.createElement("script");
      sc.src=U[i++]; sc.onload=()=>res(); sc.onerror=tryOne;
      document.head.appendChild(sc);
    };
    tryOne();
  });
}
function buzz(ok){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(C){ const a=new C(), o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination);
      o.frequency.value=ok?880:220; g.gain.value=.07;
      o.start(); setTimeout(()=>{ try{o.stop();a.close();}catch(e){} }, ok?110:260); }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(ok?[35,40,35]:[90,60,90]); }catch(e){}
}
async function scanStart(){
  if(SCAN.on) return;
  try{ await cargaJsQR(); }catch(e){ toast("No se pudo cargar el lector"); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ toast("Este navegador no da cámara"); return; }
  try{ SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); }
  catch(e){ toast("Sin permiso de cámara"); return; }
  SCAN.on=true; SCAN.msg=null; SCAN.last=""; render();
  const v=document.getElementById("cam"); if(!v){ scanStop(); return; }
  v.setAttribute("playsinline",""); v.muted=true; v.srcObject=SCAN.stream;
  try{ await v.play(); }catch(e){}
  const cv=document.createElement("canvas");
  const cx=cv.getContext("2d",{willReadFrequently:true});
  const tick=()=>{
    if(!SCAN.on) return;
    try{
      if(v.readyState>=2 && v.videoWidth){
        const w=Math.min(540,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth);
        cv.width=w; cv.height=h; cx.drawImage(v,0,0,w,h);
        const im=cx.getImageData(0,0,w,h);
        const q=window.jsQR(im.data,w,h,{inversionAttempts:"dontInvert"});
        if(q&&q.data){ onScan(q.data); return; }
      }
    }catch(e){}
    SCAN.raf=requestAnimationFrame(tick);
  };
  tick();
}
function scanStop(){
  SCAN.on=false;
  if(SCAN.raf) cancelAnimationFrame(SCAN.raf);
  SCAN.raf=0;
  if(SCAN.stream){ try{ SCAN.stream.getTracks().forEach(t=>t.stop()); }catch(e){} SCAN.stream=null; }
}
/* cada lectura cierra la cámara: se registra uno y se vuelve a abrir para el siguiente */
async function onScan(txt){
  scanStop();
  const p=String(txt).split("|");
  if(p[0]!=="AM4"||!p[1]){
    SCAN.msg={k:"ajeno",t:"Ese código no es de la fiesta"}; buzz(false); render(); return;
  }
  await marcar(p[1], p[3]||"", false);
}
/* aMano: marcar por folio no revisa el testigo, porque ahí decide el consejo */
async function marcar(gid,tok,aMano){
  const nom=(PUB.roster[gid]||PUB.live[gid]||{}).name||"";
  const lv=(PUB.live||{})[gid];
  if(!aMano && lv && lv.tok && String(tok||"")!==String(lv.tok)){
    SCAN.msg={k:"venc", t:(lv.name||nom||"Ese pase")+": código vencido",
      s:"se le cambió el "+horaC(lv.tokts)+". El que sirve es el que trae ahora en su teléfono, no una captura vieja.",
      gid:gid};
    buzz(false); render(); return;
  }
  const r=await pubEntrada(gid);
  if(r.k==="no")       { SCAN.msg={k:"sin",t:nom?nom+" no ha sacado su pase":"Pase desconocido",gid}; buzz(false); }
  else if(r.k==="dup") { SCAN.msg={k:"dup",t:(r.r.name||nom)+" ya había entrado",s:horaC(r.r.entry.ts),gid}; buzz(false); }
  else if(r.k==="ok")  { SCAN.msg={k:"ok",t:(r.r.name||nom),s:"entrada registrada "+horaC(Date.now()),gid}; buzz(true); }
  else                 { SCAN.msg={k:"sin",t:"No se pudo registrar",gid}; buzz(false); }
  render();
}
function horaC(ts){ if(!ts) return "—";
  const d=new Date(+ts);
  return d.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" · "+
         d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false}); }
function horaS(ts){ if(!ts) return "—";
  return new Date(+ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false}); }

/* ------------------------------------------------------------
   Quién invitó a quién.
   Se juntan dos cosas distintas: lo que el propio invitado declaró
   al sacar su pase, y los avales que el consejo le puso en Gente.
   Cada renglón dice de dónde viene.
   ------------------------------------------------------------ */
function padrinos(){
  const G=S.guests||[], L=PUB.live||{}, map={};
  const mete=(nombre,g,via)=>{
    if(!nombre) return;
    const k=norm(nombre); if(!k) return;
    if(!map[k]) map[k]={k:k,name:nombre,items:[]};
    const ya=map[k].items.find(x=>x.g.id===g.id);
    if(ya){ if(ya.via.indexOf(via)<0) ya.via.push(via); }
    else map[k].items.push({g:g,via:[via]});
  };
  G.forEach(g=>{
    const lv=L[g.id];
    if(lv&&lv.inv&&lv.inv.name) mete(lv.inv.name,g,"declarado");
    knownBy(g).forEach(i=>{ if(i==="legacy") return; mete(nombreAval(i),g,"aval"); });
  });
  return Object.keys(map).map(k=>map[k])
    .sort((x,y)=>y.items.length-x.items.length||x.name.localeCompare(y.name,"es",{sensitivity:"base"}));
}
/* el detalle de un padrino: cuántos trae, qué proporción y quiénes */

      <div class="stat"><div class="k">Sin aval</div><div class="v ${sinAval?"red":"grn"}">${sinAval}</div><div class="u">${porc(sinAval)}</div></div>
    </div>
    ${n?`<div class="split" style="margin-top:12px">
      <i style="width:${M/n*100}%;background:var(--tea)">${M?M+" H":""}</i>
      <i style="width:${F/n*100}%;background:var(--pnk)">${F?F+" M":""}</i>

    </div>`:""}
    ${vip.length?`<div class="tiny" style="margin-top:10px">VIP que trae: ${vip.map(x=>esc(x.g.name)).join(", ")}</div>`:""}
    <hr class="sep">
    <div class="tiny" style="margin-bottom:8px">A quiénes invitó${l.length>60?" (se muestran los primeros 60 de "+l.length+")":""}</div>
    <ul class="lst">${l.slice(0,60).map(x=>{
      const lv=L[x.g.id];
      return `<li data-gopen="${x.g.id}">
        <span class="pill ${x.g.sex==="M"?"p-m":x.g.sex==="F"?"p-f":"p-q"}">${x.g.sex==="M"?"H":x.g.sex==="F"?"M":"?"}</span>
        <div class="li-main"><div class="li-t">${esc(x.g.name)} ${x.g.pvip?'<span class="mk pvip">♛</span>':x.g.vip?'<span class="mk vip">VIP</span>':""}</div>
        <div class="li-s">${folio(x.g.num)} · ${x.via.join(" y ")} · ${lv?(lv.entry&&lv.entry.ts?"ya entró":"con QR"):"sin pase"}</div></div>
        <span class="pill ${lv?"p-ok":"p-n"}">${lv?"✓":"—"}</span></li>`;

/* ============================================================

function vRegistro(){
  const L=PUB.live||{}, G=S.guests||[];
  const conPase=G.filter(g=>L[g.id]);
  const sinPase=G.filter(g=>!L[g.id]);
  const dentro=G.filter(g=>L[g.id]&&L[g.id].entry&&L[g.id].entry.ts);
  const pct=n=>G.length?Math.round(n/G.length*100):0;
  const porSexo=l=>({M:l.filter(g=>g.sex==="M").length,F:l.filter(g=>g.sex==="F").length,
                     X:l.filter(g=>g.sex!=="M"&&g.sex!=="F").length});
  const sl=porSexo(G), sp=porSexo(conPase), sd=porSexo(dentro);
  const tasa=(a,b)=>b?Math.round(a/b*100)+"%":"—";

  /* buscador general: cualquiera de la lista, con pase o sin él */
  const nq=norm(REGQ);
  const hits=!nq?[]:G.filter(g=>{
      const k=norm(g.name)+" "+norm(g.nick)+" "+norm(g.full)+" "+String(g.num||"");
      return nq.split(" ").filter(Boolean).every(w=>k.indexOf(w)>=0);
    }).slice(0,20);
  const sel=RSEL?(G.find(g=>g.id===RSEL)||null):null;

  /* les falta sacar pase, con filtros y páginas */
  const EXF={ "":()=>true,
    F:g=>g.sex==="F", M:g=>g.sex==="M", Q:g=>g.sex!=="M"&&g.sex!=="F",
    vip:g=>!!g.vip, pvip:g=>!!g.pvip, anyvip:g=>!!(g.vip||g.pvip),
    flag:g=>!!g.flag, danger:g=>!!g.danger, smoke:g=>!!g.smoke,
    nocon:g=>!!g.nocon, known:g=>puntos(g)>0, noaval:g=>puntos(g)===0,
    si:g=>g.conf==="si", tal:g=>g.conf==="tal", wa:g=>!!g.wa };
  const fn=EXF[RF.f]||EXF[""];
  const falta=sinPase.filter(g=>fn(g)
      && (RF.trust===""||nivelConf(g)===+RF.trust)
      && (!RF.tag||tagsDe(g).indexOf(RF.tag)>=0))
    .sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));
  const paginas=Math.max(1,Math.ceil(falta.length/RPP));
  const pag=Math.min(Math.max(0,RPAGE),paginas-1);
  const trozo=falta.slice(pag*RPP,pag*RPP+RPP);
  const selF=(id,opts,v)=>`<select id="${id}">${opts.map(([k,l])=>`<option value="${k}"${k===v?" selected":""}>${l}</option>`).join("")}</select>`;

  /* quién tiene pase, buscable */
  const npq=norm(RPQ);
  let conL=conPase.slice();
  if(npq){ const dig=npq.replace(/\D/g,"");
    conL=conL.filter(g=>norm(g.name).indexOf(npq)>=0||(dig&&String(+g.num||0)===String(+dig))); }
  conL.sort((x,y)=>(+((L[y.id]||{}).ts)||0)-(+((L[x.id]||{}).ts)||0));

  const PAD=padrinos();
  const padSel=PADSEL?PAD.find(p=>p.k===PADSEL):null;

  return `

    </div>
    <div class="row" style="gap:10px">
      <div class="stat"><div class="k">Con pase</div><div class="v">${conPase.length}</div><div class="u">${pct(conPase.length)}% de la lista</div></div>
      <div class="stat"><div class="k">Sin pase</div><div class="v red">${sinPase.length}</div><div class="u">${pct(sinPase.length)}%</div></div>
      <div class="stat"><div class="k">Dentro</div><div class="v">${dentro.length}</div><div class="u">${tasa(dentro.length,conPase.length)} de los que tienen pase</div></div>
    </div>

  <div class="card" style="border:2px solid rgba(139,92,246,.3)">
    <h2>Buscar y cambiar un código</h2>
    <p class="sub">cualquiera de los ${G.length}, con pase o sin él. Al cambiar el código, el anterior
      deja de servir en la puerta y el invitado ve el nuevo al abrir su pase con su mismo NIP.</p>
    <div class="row"><input id="regQ" placeholder="Nombre, apodo o folio" value="${esc(REGQ)}" autocomplete="off"></div>
    ${nq&&!hits.length?`<div class="empty">Nadie con ese nombre o folio</div>`:""}
    ${hits.length?`<ul class="lst">${hits.map(g=>`<li data-reg-sel="${g.id}">

/* ============================================================
   ACCESO DEL CONSEJO
   Cada integrante tiene su NIP de cuatro dígitos. Se pide cuando
   el teléfono no lo recuerda o cuando pasaron más de siete días.
   Solo mango, nicole y juan pueden borrar el NIP de otro.
   ============================================================ */
const AUTHK="mngostat.auth", AUTHDIAS=7;
const SUPER=["mango","nicole","juan"];
const CLAVE_BORRAR="SOYGAYPORSIEMPRE.COM";
let GATE={paso:"lista", id:null, pin:"", pin2:"", bad:false};

function esSuper(c){ return !!(c && SUPER.indexOf(norm(c.name))>=0); }
function soySuper(){ return esSuper(meCrew()); }

function authOK(){
  try{
    const a=JSON.parse(localStorage.getItem(AUTHK)||"null");
    return !!(a && a.id===ME && (Date.now()-(+a.ts||0)) < AUTHDIAS*864e5);
  }catch(e){ return false; }
}
function authSet(){ try{ localStorage.setItem(AUTHK,JSON.stringify({id:ME,ts:Date.now()})); }catch(e){} }
function authOut(){ try{ localStorage.removeItem(AUTHK); }catch(e){} }

/* el NIP se guarda derivado con SHA-256, nunca en claro */
async function hashNip(id,p){
  const txt="mngostat:"+id+":"+p;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=0x811c9dc5;
  for(let i=0;i<txt.length;i++){ h^=txt.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return "fnv"+h.toString(16);
}
