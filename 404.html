<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANTROMANGO IV</title>
<style>
html,body{margin:0;height:100%;background:#F4F2EE;color:#1F1724;
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.w{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
h1{font-size:28px;font-weight:900;letter-spacing:-.04em;margin:0 0 6px}
p{color:#5C5169;font-size:15px;margin:0 0 20px}
a{display:inline-block;padding:14px 22px;border-radius:16px;font-weight:800;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,#FF7A00,#FF2D20 95%)}
</style>
</head>
<body>
<div class="w"><div>
  <h1>Esa página no existe</h1>
  <p>La liga del evento es la de abajo.</p>
  <a id="go" href="/">Ir a mi pase</a>
</div></div>
<script>
/* la raíz del sitio es el primer segmento de la ruta en un repositorio de proyecto */
(function(){
  var p=location.pathname.split("/").filter(Boolean);
  document.getElementById("go").href = p.length ? "/"+p[0]+"/" : "/";
})();
</script>
</body>
</html>
