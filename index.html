<style>
:root{
  --bg:#FFFFFF; --bg2:#F4F2EE; --card:#FFFFFF; --card2:#F1EFEB;
  --line:rgba(31,23,36,.13);
  --tx:#1F1724; --tx2:#5C5169; --tx3:#8C8299;
  --sh:0 2px 12px rgba(31,23,36,.07);
  --sh2:0 10px 34px rgba(31,23,36,.13);
  --red:#FF2D20; --org:#FF7A00; --yel:#FFC800; --grn:#00B050;
  --r:22px;
  --pad: max(16px, env(safe-area-inset-left));
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg2);color:var(--tx)}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%; min-height:100dvh;
}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:0 var(--pad);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.pane{padding-top:calc(10px + env(safe-area-inset-top))}

.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
.top img{width:34px;height:34px;border-radius:9px;box-shadow:var(--sh)}
.top .t1{font-weight:800;letter-spacing:-.02em;font-size:17px}
.top .t2{font-size:11.5px;color:var(--tx3);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none;background:var(--yel)}
.dot.on{background:var(--grn)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card.flat{background:var(--card2);box-shadow:none}
h1{margin:0}
h2{font-size:21px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px}
h3{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin:0 0 10px}
p{margin:0 0 10px;color:var(--tx2);font-size:14.5px}
p.lead{color:var(--tx);font-size:15.5px}
p:last-child{margin-bottom:0}
.mut{color:var(--tx3);font-size:12.5px}
a{color:var(--org);font-weight:800;text-decoration:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:16px;background:var(--tx);color:#fff;font-weight:800;font-size:16px;
  letter-spacing:-.01em;transition:transform .12s ease}
.btn:active{transform:scale(.978)}
.btn.mango{background:linear-gradient(135deg,var(--org),var(--red) 95%)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.wa{background:#25D366;color:#06351A;margin-bottom:12px}
.btn.sm{padding:12px 14px;font-size:14px;border-radius:13px}

.fld{display:block;margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.fld input{width:100%;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
  font-size:16.5px;font-weight:600;outline:none}
.fld input:focus{border-color:var(--org)}

.hero{text-align:center;padding:14px 4px 2px}
.hero img{width:86px;height:86px;border-radius:24px;box-shadow:var(--sh2);margin-bottom:14px}
.hero .ttl{font-size:clamp(28px,9vw,38px);font-weight:900;letter-spacing:-.045em;line-height:1}
.hero .when{margin-top:8px;font-size:14px;font-weight:700;color:var(--tx2)}
.cd{display:flex;gap:7px;justify-content:center;margin:16px 0 4px}
.cd div{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:9px 0;min-width:62px}
.cd b{display:block;font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1}
.cd span{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}

.hit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;background:var(--card);
  border-radius:15px;box-shadow:var(--sh);margin-bottom:8px}
.hit .av{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;
  font-weight:900;font-size:14px;color:var(--tx2);flex:none}
.hit.done .av{background:#E8F7EE;color:#0B6B35}
.hit .nm{font-weight:800;letter-spacing:-.015em;font-size:15.5px}
.hit .sb{font-size:12px;color:var(--tx3);font-weight:600}
.hit .ar{margin-left:auto;color:var(--tx3);font-weight:900}

.pins{display:flex;gap:12px;justify-content:center;margin:18px 0 22px}
.pins i{width:15px;height:15px;border-radius:50%;background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--line);
  transition:transform .14s ease,background .14s}
.pins i.f{background:var(--tx);box-shadow:none;transform:scale(1.12)}
.pins.bad i{background:#FDE2E0;box-shadow:inset 0 0 0 1.5px rgba(232,52,43,.45)}
@keyframes shk{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.pins.bad{animation:shk .4s}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kp button{padding:16px 0;border-radius:16px;background:var(--card);box-shadow:var(--sh);font-size:23px;font-weight:800}
.kp button:active{background:var(--card2)}
.kp button.z{background:transparent;box-shadow:none;font-size:14.5px;font-weight:800;color:var(--tx2)}

.tk{background:var(--card);border-radius:24px;box-shadow:var(--sh2);overflow:hidden;margin-bottom:12px}
.tk .hd{background:linear-gradient(135deg,var(--org),var(--red) 92%);color:#fff;padding:16px 18px}
.tk .hd .e1{font-weight:900;font-size:19px;letter-spacing:-.03em}
.tk .hd .e2{font-size:12.5px;font-weight:700;opacity:.92}
.perf{position:relative;height:22px;background:var(--card)}
.perf:before,.perf:after{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%;
  background:var(--bg2);transform:translateY(-50%)}
.perf:before{left:-11px} .perf:after{right:-11px}
.perf hr{position:absolute;top:50%;left:14px;right:14px;border:0;border-top:2px dashed var(--line);margin:0}
.qrw{padding:4px 18px 16px;text-align:center}
.qrw .qr{display:inline-block;background:#fff;padding:10px;border-radius:14px}
.qrw .qr table{border-collapse:collapse;border-spacing:0;margin:0 auto}
.qrw .qr td{width:var(--c,5px);height:var(--c,5px);padding:0;line-height:0}
.qrw .qr td.d{background:#1F1724}
.folio{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.14em;margin-top:12px}
.tkname{font-size:19px;font-weight:900;letter-spacing:-.03em;margin-top:2px}
.rows{padding:0 18px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.row b{font-weight:800;text-align:right}
.row span{color:var(--tx3);font-weight:700}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800}
.chip.ok{background:#E8F7EE;color:#0B6B35} .chip.wait{background:#FFF6DC;color:#7A5B00}

.itm{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.itm .hh{display:flex;align-items:center;gap:12px}
.ring{width:46px;height:46px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900}
.itm .nm{font-weight:800;letter-spacing:-.015em;font-size:15.5px}
.itm .sb{font-size:12.5px;color:var(--tx3);font-weight:700}
.stp{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stp .lb{font-size:12.5px;font-weight:800;color:var(--tx2);margin-right:auto}
.stp button{width:38px;height:38px;border-radius:12px;background:var(--card2);font-size:19px;font-weight:800;flex:none}
.stp input{width:64px;text-align:center;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);
  font-size:16px;font-weight:800;background:var(--card)}
.mine{background:#FFF6DC;border-radius:12px;padding:8px 11px;margin-top:10px;font-size:12.5px;font-weight:700;color:#7A5B00}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:800;color:var(--tx3)}
nav button i{font-size:19px;font-style:normal;line-height:1}
nav button.on{color:var(--tx)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:var(--tx);color:#fff;padding:11px 17px;border-radius:14px;font-size:13.5px;font-weight:700;
  opacity:0;transition:.22s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
#toast.s{opacity:1;transform:translateX(-50%) translateY(0)}
.ld{display:grid;place-items:center;min-height:70vh;color:var(--tx3);font-weight:700;font-size:13.5px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--org);
  animation:sp .8s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';

/* ---------- almacenamiento del propio teléfono ---------- */
const LK={me:"mngopase.me", dev:"mngopase.dev", ros:"mngopase.roster",
          nee:"mngopase.needs", mine:"mngopase.mine", q:"mngopase.queue"};
const ls={
  g(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  s(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  d(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- estado ---------- */
let SCR="boot";                  /* boot · find · pin · alta · pass */
let TAB="pass";                  /* pass · falta · info */
let PINMODE="open";              /* open · nuevo · confirma */
let roster=ls.g(LK.ros,{});
let needs =ls.g(LK.nee,{});
let live  ={};
let me    =ls.g(LK.me,null);     /* {gid,num,name} */
let mine  =ls.g(LK.mine,null);   /* copia local del propio registro, sirve sin señal */
let pick  =null;
let pin="", pin2="", pinBad=false;
let q="";
let NET=null;                    /* {ip,ciudad} */
let db=null,fns=null,online=false,FBon=false;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
                .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const folio=n=>"A"+String(n||0).padStart(5,"0");
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function toast(t){ const e=$("#toast"); if(!e) return; e.textContent=t; e.classList.add("s");
  clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("s"),2600); }
function hora(ts){ if(!ts) return "—"; const d=new Date(+ts);
  return d.toLocaleDateString("es-MX",{day:"numeric",month:"short"})+" · "+
         d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}); }
function fechaLarga(){
  const d=new Date(EV.iso);
  const s=d.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  return s.charAt(0).toUpperCase()+s.slice(1)+" · "+
         d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false})+" h";
}

/* huella del navegador, propia de este teléfono */
function devInfo(){
  let id=ls.g(LK.dev,null);
  if(!id){ id=uid()+uid(); ls.s(LK.dev,id); }
  const ua=navigator.userAgent||"";
  let mod="Dispositivo";
  if(/iPhone/i.test(ua)) mod="iPhone";
  else if(/iPad/i.test(ua)) mod="iPad";
  else if(/Android/i.test(ua)) mod=((ua.match(/Android[^;)]*;\s*([^;)]+)/)||[])[1]||"Android").trim();
  else if(/Macintosh/i.test(ua)) mod="Mac";
  else if(/Windows/i.test(ua)) mod="Windows";
  let nav="Navegador";
  if(/Instagram/i.test(ua)) nav="Instagram";
  else if(/FBAN|FBAV/i.test(ua)) nav="Facebook";
  else if(/CriOS|Chrome/i.test(ua)) nav="Chrome";
  else if(/FxiOS|Firefox/i.test(ua)) nav="Firefox";
  else if(/Safari/i.test(ua)) nav="Safari";
  return { id, mod, nav, scr:screen.width+"x"+screen.height,
           lang:navigator.language||"", tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||"") };
}
const DEV=devInfo();

/* La dirección de red la devuelve un servicio externo porque el navegador
   no la conoce. ipapi agrega ciudad aproximada; ipify solo la dirección. */
async function net(){
  if(NET) return NET;
  const fuentes=[
    ["https://ipapi.co/json/", j=>({ip:j.ip,ciudad:[j.city,j.region,j.country_name].filter(Boolean).join(", ")})],
    ["https://api.ipify.org?format=json", j=>({ip:j.ip,ciudad:""})]
  ];
  for(const [u,map] of fuentes){ try{
    const c=new AbortController(), t=setTimeout(()=>c.abort(),4500);
    const r=await fetch(u,{signal:c.signal}); clearTimeout(t);
    const j=await r.json(); const v=map(j);
    if(v&&v.ip){ NET=v; return NET; }
  }catch(e){} }
  return {ip:"",ciudad:""};
}

/* El NIP se guarda derivado con SHA-256 sobre el identificador del pase.
   Cuatro dígitos no constituyen un secreto fuerte; esto solo evita
   guardarlos en claro y hace que nadie los pueda cambiar después. */
async function hashPin(gid,p){
  const txt="am4:"+gid+":"+p;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h=0x811c9dc5;
  for(let i=0;i<txt.length;i++){ h^=txt.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return "fnv"+h.toString(16);
}

/* ---------- escritura con cola, sobrevive a la falta de señal ---------- */
function qGet(){ return ls.g(LK.q,[]); }
function put(up){
  const c=qGet(); Object.keys(up).forEach(p=>c.push({p,v:up[p]})); ls.s(LK.q,c); flush();
}
async function flush(){
  if(!FBon||!db) return;
  const c=qGet(); if(!c.length) return;
  const up={}; c.forEach(e=>up[e.p]= e.v===null?null:e.v);
  try{ await fns.update(fns.ref(db,ROOM),up); ls.s(LK.q,[]); }catch(e){}
}

async function keypad(k){
  let cur=PINMODE==="confirma"?pin2:pin;
  if(k==="del") cur="";
  else if(k==="back"){
    if(cur.length) cur=cur.slice(0,-1);
    else if(PINMODE==="confirma"){ PINMODE="nuevo"; pin=""; cur=""; }
    else if(PINMODE==="nuevo"){ SCR="alta"; pin=""; render(); return; }
    else { SCR=me?"pass":"find"; pick=null; pin=""; render(); return; }
  }
  else if(cur.length<4) cur+=k;
  pinBad=false;
  if(PINMODE==="confirma") pin2=cur; else pin=cur;
  render();
  if(cur.length!==4) return;
  await new Promise(r=>setTimeout(r,150));
  if(PINMODE==="open") return abrirConNip();
  if(PINMODE==="nuevo"){ PINMODE="confirma"; pin2=""; render(); return; }
  if(pin2!==pin){ pinBad=true; pin2=""; render(); toast("No coinciden"); return; }
  return altaFinal();
}

/* ---------- abrir un pase que ya existe ---------- */
async function abrirConNip(){
  const g=(pick||me).gid;
  const h=await hashPin(g,pin);
  let real=null;
  if(FBon&&db){ try{ const s=await fns.get(fns.ref(db,ROOM+"/reg/"+g)); if(s.exists()) real=s.val(); }catch(e){} }
  if(!real&&mine&&mine.gid===g&&mine.pinh) real={pinh:mine.pinh,tel:mine.tel,ts:mine.ts};
  if(!real){ pin=""; render(); toast("No pudimos verificar. Revisa tu conexión."); return; }
  if(real.pinh&&real.pinh!==h){ pinBad=true; pin=""; render(); toast("NIP incorrecto"); return; }
  const base=roster[g]||live[g]||{};
  me={gid:g,num:base.num,name:base.name};
  ls.s(LK.me,me);
  /* lo guardado en el teléfono es la base; la rama pública manda cuando existe */
  const antes=(mine&&mine.gid===g)?mine:{};
  mine=Object.assign({},antes,live[g]||{},
        {gid:g,tel:real.tel||antes.tel,pinh:real.pinh||antes.pinh,
         ts:real.ts||(live[g]||{}).ts||antes.ts});
  ls.s(LK.mine,mine);
  pin=""; pick=null; SCR="pass"; TAB="pass"; render();
  logOpen();
}

/* ---------- alta de un pase nuevo ---------- */
async function altaFinal(){
  const g=pick.gid, ts=Date.now();
  const h=await hashPin(g,pin);
  const n=await net();
  const k=uid();
  const pub={ gid:g, num:pick.num, name:pick.name, ts, opens_n:1, last:ts, bring:{} };
  const prv={ gid:g, num:pick.num, name:pick.name, tel:pick.tel, pinh:h, ts,
              ip:n.ip||"", ciudad:n.ciudad||"",
              dev:{id:DEV.id,mod:DEV.mod,nav:DEV.nav,scr:DEV.scr,lang:DEV.lang,tz:DEV.tz},
              opens:{} };
  prv.opens[k]={ts,ip:n.ip||"",ciudad:n.ciudad||"",dev:DEV.id,mod:DEV.mod,nav:DEV.nav};
  put({ ["live/"+g]:pub, ["reg/"+g]:prv });
  live[g]=pub;
  me={gid:g,num:pick.num,name:pick.name}; ls.s(LK.me,me);
  mine=Object.assign({},pub,{tel:pick.tel,pinh:h}); ls.s(LK.mine,mine);
  pin=""; pin2=""; PINMODE="open"; pick=null; SCR="pass"; TAB="pass"; render();
  toast("Tu pase está listo");
}

async function logOpen(){

  const ts=Date.now(), k=uid(), n=await net();
  const nn=(+((mine||{}).opens_n)||0)+1;
  put({ ["reg/"+me.gid+"/opens/"+k]:{ts,ip:n.ip||"",ciudad:n.ciudad||"",dev:DEV.id,mod:DEV.mod,nav:DEV.nav},
        ["live/"+me.gid+"/opens_n"]:nn,
        ["live/"+me.gid+"/last"]:ts });
  mine=Object.assign({},mine||{},{opens_n:nn,last:ts}); ls.s(LK.mine,mine);

/* ---------- lo que el asistente se compromete a llevar ---------- */
function setBring(sid,n){
  if(!me) return;
  const it=needs[sid]||{};
  mine=mine||{}; mine.bring=Object.assign({},mine.bring||{});
  if(n<=0){ delete mine.bring[sid]; put({["live/"+me.gid+"/bring/"+sid]:null}); }
  else{
    const v={qty:n,unit:it.unit||"",name:it.name||"",ts:Date.now()};
    mine.bring[sid]=v; put({["live/"+me.gid+"/bring/"+sid]:v});
  }
  ls.s(LK.mine,mine);
  if(live[me.gid]) live[me.gid].bring=Object.assign({},mine.bring);
  render();
}

async function initFB(){
  try{
    const SRC=[["https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm",
                "https://cdn.jsdelivr.net/npm/firebase@10.12.0/database/+esm"],
               ["https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"]];
    let a,d;
    for(const s of SRC){ try{ a=await import(s[0]); d=await import(s[1]); break; }catch(err){ a=null; } }
    if(!a) throw new Error("firebase no cargó");
    const app=a.initializeApp(FB); db=d.getDatabase(app); fns=d; FBon=true;
    d.onValue(d.ref(db,".info/connected"),s=>{ online=s.val()===true; if(online) flush(); render(); });
    d.onValue(d.ref(db,ROOM+"/roster"),s=>{ roster=s.val()||{}; ls.s(LK.ros,roster);
      if(SCR==="find"){ const c=$("#hits"); if(c) c.innerHTML=hitsHTML(); else render(); } });
    d.onValue(d.ref(db,ROOM+"/needs"),s=>{ needs=s.val()||{}; ls.s(LK.nee,needs);
      if(SCR==="pass"&&TAB==="falta") render(); });
    d.onValue(d.ref(db,ROOM+"/live"),s=>{
      live=s.val()||{};
      if(me&&live[me.gid]) { mine=Object.assign({},mine||{},live[me.gid],
        {tel:(mine||{}).tel,pinh:(mine||{}).pinh}); ls.s(LK.mine,mine); }
      render();
    });
  }catch(e){ FBon=false; render(); }
}

/* =====================================================================
   arranque
   ===================================================================== */
(function boot(){
  if(me&&me.gid){ PINMODE="open"; pick=null; SCR="pin"; }   /* teléfono conocido: pide el NIP */
  else SCR="find";
  render();
  net();
  initFB();
  setInterval(()=>{ if(SCR==="find"||(SCR==="pass"&&TAB==="pass")) render(); },30000);
  setInterval(flush,15000);
  window.addEventListener("online",flush);
})();
</script>
